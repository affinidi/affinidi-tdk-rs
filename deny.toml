[advisories]
version = 2
# Deliberately empty: no advisory is currently suppressed for the build graph.
#
# The sole entry here ignored RUSTSEC-2024-0370 (proc-macro-error) on the grounds
# that it was a build-time-only transitive of the ssi-json-ld stack, and said it
# would "drop out once upstream ssi-* releases migrate off it". Rather than wait
# for upstream, cache-sdk 0.8.36 retired did:cheqd resolution and dropped
# `did-resolver-cheqd`, which took the whole ssi-0.1 stack out of the graph — so
# the entry stopped matching anything and cargo-deny began warning
# `advisory-not-detected` about it.
#
# Keep it empty. A suppression list nobody trusts is a list nobody audits, and an
# entry that matches nothing is indistinguishable from one that matters. If an
# advisory genuinely has to be accepted, add it with a reason *and* the condition
# that would clear it, and delete it the moment that condition is met.
#
# Note this governs the BUILD GRAPH. `cargo audit` reads Cargo.lock and has its
# own list, `auditIgnore`, duplicated in .github/workflows/checks.yaml and
# release.yaml — change those together.
ignore = []

[bans]
multiple-versions = "allow"

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "MIT-0",
  "MIT",
  "Unlicense",
  "Zlib",
  # As stated here https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html#spdx-identifiers
  # 3.11 versions of SPDX License List was used and below licenses are not included there.
  # They are commented to avoid "[license-not-encountered]" warnings.
  #    "Apache-1.1",
  #    "WTFPL",
  #    "Fair",
  #    "Intel",
  #    "MIT-Modern-Variant",
  #    "MulanPSL-2.0",
  #    "Multics",
  #    "Naumen",
  #    "PHP-3.01",
  #    "PostgreSQL",
  #    "Python-2.0",
  #    "OFL-1.1",
  #    "MirOS",
  #    "UPL-1.0",
  #    "Unicode-DFS-2016",
  #    "AFL-2.1",
]

# Per-crate licence exceptions. Every entry must match a crate in Cargo.lock:
# `cargo deny check licenses` warns `license-exception-not-encountered` for one
# that does not, and such an entry should be deleted rather than left to
# pre-approve a licence for whatever crate of that name arrives next. Each entry
# carries the reason it is needed and the date it was last confirmed.
exceptions = [
  # Confirmed 2026-11-13. The Mozilla root-certificate data bundled by
  # webpki-root-certs (via rustls-platform-verifier) is published under
  # CDLA-Permissive-2.0, a permissive data licence. Scoped to this crate so the
  # global list does not admit it for code.
  { allow = [
    "CDLA-Permissive-2.0",
  ], crate = "webpki-root-certs" },
  # Confirmed 2026-11-13. `textwrap` 0.16 (via `affinidi-messaging-text-client`)
  # pulls the ICU segmentation crates for line breaking, and ICU relicensed to
  # Unicode-3.0. Not copyleft: Unicode-3.0 is the OSI-approved Unicode License
  # v3, a permissive licence with an attribution clause covering the bundled
  # data tables. It is a per-crate exception rather than a global `allow` entry
  # because the global list is what stops a future dependency arriving under a
  # licence nobody looked at.
  #
  # These four are the whole of it: the two `*_data` crates carry the data
  # tables, the other two the code that reads them.
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_locale_fallback" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_locale_fallback_data" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_segmenter" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_segmenter_data" },
  # Confirmed 2026-11-13. The ICU4X crates behind `idna` (via `url`) for
  # internationalised domain names, together with the ICU4X support crates
  # they share with the segmenter above. All are Unicode-3.0, for the reason
  # given there.
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_collections" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_locale_core" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_normalizer" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_normalizer_data" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_properties" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_properties_data" },
  { allow = [
    "Unicode-3.0",
  ], crate = "icu_provider" },
  { allow = [
    "Unicode-3.0",
  ], crate = "litemap" },
  { allow = [
    "Unicode-3.0",
  ], crate = "potential_utf" },
  { allow = [
    "Unicode-3.0",
  ], crate = "tinystr" },
  { allow = [
    "Unicode-3.0",
  ], crate = "writeable" },
  { allow = [
    "Unicode-3.0",
  ], crate = "yoke" },
  { allow = [
    "Unicode-3.0",
  ], crate = "yoke-derive" },
  { allow = [
    "Unicode-3.0",
  ], crate = "zerofrom" },
  { allow = [
    "Unicode-3.0",
  ], crate = "zerofrom-derive" },
  { allow = [
    "Unicode-3.0",
  ], crate = "zerotrie" },
  { allow = [
    "Unicode-3.0",
  ], crate = "zerovec" },
  { allow = [
    "Unicode-3.0",
  ], crate = "zerovec-derive" },
  # Confirmed 2026-11-13. unicode-ident (via proc-macro2) is
  # `(MIT OR Apache-2.0) AND Unicode-3.0`: its generated tables come from the
  # Unicode Character Database.
  { allow = [
    "Unicode-3.0",
  ], crate = "unicode-ident" },
]

# Sigh
[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# Every dependency resolves from crates.io today. Refuse any other registry or
# git source, so one cannot arrive without this file being changed.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
