name: fuzz

# Coverage-guided fuzzing of the parsing/verification layers (issue #477).
# cargo-fuzz needs nightly, so this runs OUTSIDE the reusable stable pipeline:
# a short smoke pass on PRs that touch a fuzzed crate, and a longer pass nightly.
on:
  pull_request:
    types:
      - opened
      - synchronize
      # A reopened PR, or a draft marked ready, gets a fresh run too.
      - reopened
      - ready_for_review
    paths:
      - "crates/messaging/affinidi-messaging-didcomm/**"
      - "crates/messaging/affinidi-messaging-didcomm-v1/**"
      - "crates/messaging/affinidi-tsp/**"
      - "crates/credentials/affinidi-sd-jwt/**"
      - "crates/credentials/affinidi-rdf-encoding/**"
      - "crates/credentials/affinidi-status-list/**"
      - "crates/credentials/affinidi-mdoc/**"
      - "crates/trust/affinidi-trust-lists/**"
      - "crates/core/affinidi-cesr/**"
      # Not fuzzed directly, but in the fuzz crates' dependency graph by path:
      # a registry dependency change here moves the committed fuzz locks.
      - "crates/core/affinidi-crypto/**"
      - "crates/core/affinidi-encoding/**"
      - "scripts/check-fuzz-lock.sh"
      - ".github/workflows/fuzz.yaml"
  schedule:
    # 03:17 UTC daily — off the hour to avoid the scheduler rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a PR supersedes the run already in flight for it: cancel that
# one instead of paying for both. Only pull_request runs are cancelled —
# scheduled and dispatched runs (and release.yaml, which has no such block)
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: crates/messaging/affinidi-messaging-didcomm/fuzz
            target: unpack
          - dir: crates/messaging/affinidi-messaging-didcomm/fuzz
            target: decrypt
          - dir: crates/messaging/affinidi-messaging-didcomm/fuzz
            target: message
          - dir: crates/messaging/affinidi-messaging-didcomm/fuzz
            target: message_structured
          - dir: crates/credentials/affinidi-sd-jwt/fuzz
            target: parse
          - dir: crates/credentials/affinidi-sd-jwt/fuzz
            target: verify
          - dir: crates/core/affinidi-cesr/fuzz
            target: matter
          - dir: crates/core/affinidi-cesr/fuzz
            target: stream
          - dir: crates/messaging/affinidi-tsp/fuzz
            target: envelope
          - dir: crates/messaging/affinidi-tsp/fuzz
            target: unpack
          - dir: crates/messaging/affinidi-messaging-didcomm-v1/fuzz
            target: unpack
          - dir: crates/credentials/affinidi-rdf-encoding/fuzz
            target: nquads
          - dir: crates/credentials/affinidi-rdf-encoding/fuzz
            target: jsonld
          - dir: crates/credentials/affinidi-status-list/fuzz
            target: bitstring
          - dir: crates/credentials/affinidi-status-list/fuzz
            target: token
          - dir: crates/credentials/affinidi-mdoc/fuzz
            target: issuer_signed
          - dir: crates/credentials/affinidi-mdoc/fuzz
            target: device_response
          - dir: crates/credentials/affinidi-mdoc/fuzz
            target: engagement
          - dir: crates/trust/affinidi-trust-lists/fuzz
            target: xml
          - dir: crates/trust/affinidi-trust-lists/fuzz
            target: certificate
    env:
      # Override the repo's stable rust-toolchain.toml for this job.
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      # Restrict runner egress (SEC-3898): a fuzz build compiles and runs
      # third-party crate build scripts; block every network destination except
      # the ones this job legitimately needs, so a compromised dependency cannot
      # exfiltrate. New-version supply-chain risk is separately closed by the
      # committed fuzz Cargo.lock (SEC-3899); this is defense in depth.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            static.crates.io:443
            index.crates.io:443
            static.rust-lang.org:443
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Actions SHA-pinned (SEC-3898): a mutable tag like @v4 can be repointed to
      # malicious code; pin to the exact commit the tag names today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly

      # Pin cargo-fuzz (SEC-3898): unpinned, this pulls the newest release on
      # every run, which is both non-reproducible and a supply-chain intake.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Enforce the committed lockfile (SEC-3899). cargo-fuzz has no --locked
      # passthrough, so gate here instead: the script requires every crates.io
      # version and checksum to be exactly as committed — which is exactly when
      # an unreviewed dependency version would otherwise be pulled — while
      # letting the local path packages renumber, as they must whenever a
      # fuzzed crate takes its mandatory version bump. The build then runs
      # offline against the vetted graph.
      - name: Verify fuzz lockfile pins the registry graph (pin gate)
        run: ./scripts/check-fuzz-lock.sh "${{ matrix.dir }}"

      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          # Longer pass on the nightly schedule, short smoke pass on PRs.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION=300
          else
            DURATION=60
          fi
          mkdir -p "corpus/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" \
            -- -max_total_time=$DURATION -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Target names repeat across fuzz crates (several `unpack`s), so the
          # job index keeps artifact names unique within a run.
          name: fuzz-artifacts-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/
          if-no-files-found: ignore
