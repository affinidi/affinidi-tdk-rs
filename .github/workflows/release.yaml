name: "release"

on:
  push:
    branches:
      - main

jobs:
  rust-pipeline:
    uses: affinidi/pipeline-rust/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      toolchain: "1.95.0"
      rustflags: "-D warnings --cfg tracing_unstable"
      # quinn-proto (RUSTSEC-2024-0373), paste (RUSTSEC-2024-0436, below) and
      # crypto-bigint 0.5 (RUSTSEC-2026-0387, below) are
      # suppressed.
      #
      # RUSTSEC-2026-0258 (h2, unbounded empty DATA frames) was the reason this
      # list existed. It is now genuinely fixed rather than suppressed: h2 0.3.27
      # arrived through reqwest 0.11 <- ssi-dids-core <- the optional `did-cheqd`
      # feature, and cache-sdk 0.8.36 retired did:cheqd resolution and dropped
      # `did-resolver-cheqd` altogether. The lockfile now takes only h2 0.4.19,
      # above the >=0.4.16 the advisory names as the fix.
      #
      # The same removal took owning_ref (2022-0040), rsa (2023-0071) and im
      # (2023-0126) out of the graph, so their entries went with it. Anything
      # re-entering the graph should fail the build rather than be inherited.
      #
      # RUSTSEC-2024-0436 (paste, unmaintained; no vulnerability) is accepted:
      # it is in Cargo.lock only through optional `image` features (AVIF:
      # ravif -> rav1e; OpenEXR: exr -> pulp). text-client uses `image` with
      # both off, so it is never compiled. The latest releases (image 0.25.10, rav1e 0.8.1, pulp 0.22.3) still use it.
      # Clears when rav1e and pulp move off `paste`: delete it then (#779).
      #
      # RUSTSEC-2026-0387 (crypto-bigint, constant-time timing variability) is
      # accepted for 0.5.5 only: 0.7.x is on 0.7.6, the fix. 0.5.5 is reached
      # solely through affinidi-bbs -> bls12_381_plus 0.9, which links
      # elliptic-curve 0.13 (non-optionally) beside 0.14 for legacy trait
      # compatibility; the advisory names no 0.5.x fix and no newer
      # bls12_381_plus exists. Delete it when bls12_381_plus drops 0.13.
      auditIgnore: "RUSTSEC-2024-0373,RUSTSEC-2024-0436,RUSTSEC-2026-0387"
      ubuntu-rust-deps: "libdbus-1-dev libssl-dev libchafa-dev"
      release_debug: true
      # `workspace_publish: true` uses `cargo publish --workspace`, which errors on
      # the first crate whose current version is already on crates.io instead of
      # skipping it. When we ship a targeted patch (e.g. four-of-many crates for a
      # security fix), that behaviour blocks the whole release. The legacy
      # per-crate path in pipeline-rust compares local vs. remote versions and
      # skips already-published crates, which is what we want for partial releases.
      # Re-enable workspace_publish once pipeline-rust grows a skip-already-published
      # option (or when a release genuinely bumps every workspace member).
      workspace_publish: false
      release_dry_run: false
      # Publish verification was killed twice (exit 143) on the default runner
      # at full parallelism, leaving mediator 0.40.0 and its dependents
      # unpublished. The mediator has since moved to
      # affinidi/affinidi-messaging-mediator, but the workspace is still large
      # enough that verification is kept on the same larger runner as checks,
      # with rustc parallelism capped to keep peak memory down.
      runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
      build-jobs: 4
