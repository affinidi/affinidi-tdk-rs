name: checks-storage
# Matrix check for the mediator's swappable storage backends, plus the
# dual-protocol (DIDComm / TSP) axis.
#
# `redis-backend` is the default and is exercised by `checks.yaml`
# (which spins up a Redis service container via `useRedis: true`).
# This workflow covers the **non-default** backends and a combined
# build, so a missing `cfg(feature = "...-backend")` gate, a stale
# stubbed method, or a broken cross-backend integration surfaces in
# CI rather than at deploy time.
#
# Per-backend job:
#   cargo check  --no-default-features --features didcomm,<backend>
#   cargo test   --no-default-features --features didcomm,<backend>
#                --lib store::<short>_store
#
# Plus a "kitchen sink" job that compiles the mediator with every
# backend feature enabled at once (and `tsp`). Catches accidental name
# collisions between feature-gated modules.
#
# The e2e jobs cover the fixture on both stores (`test-mediator (memory)`
# / `(fjall)`) and on the TSP protocol (`test-mediator (tsp)`). The last
# one matters because `tsp` is not a default feature: without it every
# `#[cfg(feature = "tsp")]` test compiles out, so an all-green CI run said
# nothing whatsoever about the TSP transport.
#
# `didcomm-service (tsp)` is the same problem one crate over. Enabling the
# fixture's `tsp` reaches the mediator and the SDK but not that crate, so its
# own feature stayed dark even after the job above was added.
#
# `storage-secrets-matrix` adds a representative storage x secrets
# cross-check. `checks.yaml` exercises the default (redis + keyring) and
# `checks-features.yaml` sweeps every secrets backend against the default
# storage, but neither builds a non-default storage *and* a non-default
# secrets backend together — where a `cfg(feature = "...")` gate that
# assumes the default of the other axis would slip through. A curated
# handful of pairs catches that without the full 3x5 cross-product.

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "crates/messaging/affinidi-messaging-mediator/**"
      - "crates/messaging/affinidi-messaging-test-mediator/**"
      - "crates/messaging/affinidi-messaging-didcomm-service/**"
      - ".github/workflows/checks-storage.yaml"

env:
  # Keep `--cfg tracing_unstable` to match the main pipeline so the
  # `valuable` feature on `tracing` resolves consistently.
  RUSTFLAGS: "--cfg tracing_unstable"

jobs:
  backend-matrix:
    name: ${{ matrix.backend.short }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - short: memory
            feature: memory-backend
            test_module: memory_store
          - short: fjall
            feature: fjall-backend
            test_module: fjall_store
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for aws_lc_rs + keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: storage-${{ matrix.backend.short }}

      - name: cargo check --no-default-features --features didcomm,${{ matrix.backend.feature }}
        run: |
          cargo check \
            -p affinidi-messaging-mediator \
            --no-default-features \
            --features "didcomm,${{ matrix.backend.feature }}"

      - name: cargo test ${{ matrix.backend.short }} backend
        # Run only the per-backend store tests rather than the full
        # mediator suite — most other tests assume the Redis-backed
        # default and aren't gated on the storage feature.
        run: |
          cargo test \
            -p affinidi-messaging-mediator \
            --no-default-features \
            --features "didcomm,${{ matrix.backend.feature }}" \
            --lib \
            "store::${{ matrix.backend.test_module }}"

  storage-secrets-matrix:
    # Representative storage x secrets pairs (not the full 3x5). Each pair
    # combines a non-default storage backend with a non-default secrets
    # backend so a feature gate that silently assumes the default of the
    # other axis fails here. `cargo check` only — the per-backend tests
    # live in `backend-matrix` and the secrets backends carry no
    # mediator-side tests of their own.
    name: ${{ matrix.combo.short }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - short: fjall + aws
            storage: fjall-backend
            secret: secrets-aws
          - short: fjall + vault
            storage: fjall-backend
            secret: secrets-vault
          - short: memory + gcp
            storage: memory-backend
            secret: secrets-gcp
          - short: redis + azure
            storage: redis-backend
            secret: secrets-azure
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for aws_lc_rs + keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: storage-secrets-${{ matrix.combo.storage }}-${{ matrix.combo.secret }}

      - name: cargo check --features didcomm,${{ matrix.combo.storage }},${{ matrix.combo.secret }}
        run: |
          cargo check \
            -p affinidi-messaging-mediator \
            --no-default-features \
            --features "didcomm,${{ matrix.combo.storage }},${{ matrix.combo.secret }}"

  redis-conformance:
    # Run the store-conformance suite against a real Redis. The
    # in-process backends (memory, fjall) are covered by the
    # `backend-matrix` job's `--lib store::<backend>` tests; this job
    # gives the *Redis* backend the same backend-agnostic semantic
    # checks so Fjall/Redis stay aligned (the Lua-based Redis logic
    # can't share code with the Rust backends, so only a live run
    # catches drift). Gated on `REDIS_URL`; each check runs on its own
    # logical DB for isolation.
    name: redis conformance
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for aws_lc_rs + keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: redis-conformance

      - name: cargo test store_conformance against Redis
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          cargo test \
            -p affinidi-messaging-mediator \
            --no-default-features \
            --features "didcomm,redis-backend" \
            --test store_conformance

  test-mediator-e2e:
    # The e2e fixture defaults to MemoryStore now; this job confirms
    # the integration suite runs end-to-end without Redis. Catches
    # the regression where someone accidentally re-introduces a
    # Redis dependency in the SDK fixture or environment plumbing.
    name: test-mediator (memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-mediator-e2e-memory

      - name: cargo test -p affinidi-messaging-test-mediator --tests
        run: |
          cargo test \
            -p affinidi-messaging-test-mediator \
            --tests

  test-mediator-e2e-fjall:
    # Same e2e suite as the memory job, this time against the on-disk
    # Fjall backend. The fixture wraps each store in a tempfile::TempDir
    # so partition files don't leak between tests.
    name: test-mediator (fjall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-mediator-e2e-fjall

      - name: cargo test -p affinidi-messaging-test-mediator --features fjall-backend --tests
        run: |
          cargo test \
            -p affinidi-messaging-test-mediator \
            --features fjall-backend \
            --tests

  test-mediator-e2e-tsp:
    # The dual-protocol axis. `tsp` is not a default feature of
    # `affinidi-messaging-test-mediator`, so the two jobs above compile
    # every `#[cfg(feature = "tsp")]` test out — which left the whole TSP
    # e2e suite (TSP delivery, auth, websocket, pickup, federation,
    # cross-mediator routing, capability discovery, and the recipient-side
    # ACL gates) passing unobserved: green CI said nothing about any of it.
    #
    # The mediator ships TSP as a first-class transport alongside DIDComm,
    # so the protocol axis deserves the same standing coverage the storage
    # backends get.
    name: test-mediator (tsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-mediator-e2e-tsp

      - name: cargo test -p affinidi-messaging-test-mediator --features tsp --tests
        run: |
          cargo test \
            -p affinidi-messaging-test-mediator \
            --features tsp \
            --tests

  didcomm-service-tsp:
    # `affinidi-messaging-didcomm-service` multiplexes TSP alongside DIDComm on
    # one websocket, behind its own `tsp` feature — off by default, and until
    # now compiled by nothing.
    #
    # Not covered by `test-mediator (tsp)`: that enables the *fixture's* `tsp`,
    # which reaches the mediator and the SDK but never this crate, since the
    # fixture is not one of its dependents. Nor by the default workspace test,
    # which builds this crate without the feature. Confirmed with a
    # `compile_error!` canary under the cfg — it fired for
    # `--workspace --features tsp` and for neither CI invocation.
    #
    # What was dark is the inbound TSP dispatch: the relationship-lifecycle
    # handling that admits application traffic under Rev 3 §7.2.2 gating, and
    # the arms that discard a padding message and route an upper-layer control
    # one. A service that mishandles those is not lossy but inert — no
    # relationship can form, so every application message is then refused.
    name: didcomm-service (tsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: didcomm-service-tsp

      - name: cargo clippy -p affinidi-messaging-didcomm-service --features tsp
        run: |
          cargo clippy \
            -p affinidi-messaging-didcomm-service \
            --features tsp \
            --all-targets \
            -- -D warnings

      - name: cargo test -p affinidi-messaging-didcomm-service --features tsp
        run: |
          cargo test \
            -p affinidi-messaging-didcomm-service \
            --features tsp \
            --tests

  all-backends-compile:
    # Compile the mediator with every backend feature enabled at
    # once, plus `tsp`. Doesn't run any tests — the test commands
    # per-backend above already do that — but a successful build here
    # proves the feature-gated modules don't conflict (duplicate
    # symbols, incompatible deps, etc.) when bundled together.
    #
    # `tsp` is in the list because it gates ~39 sites in the mediator
    # source and was previously compiled by no job in any workflow: the
    # only `tsp` in CI was a `cargo check` on the `affinidi-tdk` facade,
    # which does not pull the mediator's TSP code. A type error behind
    # that gate could reach a release unseen.
    name: all-backends compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: all-backends-compile

      - name: cargo check --features tsp,redis-backend,fjall-backend,memory-backend
        run: |
          cargo check \
            -p affinidi-messaging-mediator \
            --no-default-features \
            --features "didcomm,tsp,redis-backend,fjall-backend,memory-backend"
