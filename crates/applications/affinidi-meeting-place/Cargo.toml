[package]
name = "affinidi-meeting-place"
version = "0.5.1"
description = "Affinidi Meeting Place SDK. Discover and connect with others in a secure and private way."
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "ATM", "affinidi", "DIDComm"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
affinidi-did-authentication = "0.3.17"
affinidi-tdk-common = { version = "0.7.2", path = "../../tdk/affinidi-tdk-common" }
affinidi-messaging-didcomm = { path = "../../messaging/affinidi-messaging-didcomm", version = "0.15.15" }
affinidi-did-resolver-cache-sdk = "0.8.55"
affinidi-did-common = "0.4.8"

base64.workspace = true
chrono = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]
affinidi-secrets-resolver = "0.5.19"

clap = { workspace = true, features = ["derive"] }
rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

[lints]
workspace = true
