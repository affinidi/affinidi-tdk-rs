[package]
name = "affinidi-crypto"
version = "0.3.2"
description = "Cryptographic primitives and JWK types for Affinidi TDK"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
default = ["p256", "k256", "p384", "p521", "ed25519"]
p256 = ["dep:p256"]
k256 = ["dep:k256"]
p384 = ["dep:p384"]
p521 = ["dep:p521"]
ed25519 = ["dep:ed25519-dalek"]
# Post-quantum cryptography (experimental — W3C di-quantum-safe v0.3).
# `post-quantum` is the umbrella flag; `ml-dsa` and `slh-dsa` can be enabled
# individually. Off by default.
post-quantum = ["ml-dsa", "slh-dsa"]
ml-dsa = ["dep:ml-dsa"]
slh-dsa = ["dep:slh-dsa"]
# JOSE primitives (#327): ECDH-ES / ECDH-1PU Concat KDF, A256KW key wrap,
# A256CBC-HS512 content encryption, EdDSA signing, and ECDH key agreement
# (`jose::key_agreement`). Pulls in EdDSA via the `ed25519` feature.
jose = ["dep:aes", "dep:aes-gcm", "dep:cbc", "dep:hmac", "dep:subtle", "ed25519", "p256", "k256", "p384", "p521"]

[dependencies]
# Requires >= 0.1.7: multikey and did:key decoding goes through
# `decode_multikey_checked` / `did_key::decode_expecting`, added in 0.1.7.
# (A loose "0.1" resolved against an older lock to a version without the
# items this crate imports and failed to compile, #348.)
affinidi-encoding = "0.1.7"

base64.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"], optional = true }
k256 = { version = "0.14", features = ["ecdsa", "arithmetic", "ecdh"], optional = true }
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdsa", "arithmetic", "ecdh"], optional = true }
p521 = { version = "0.14", features = ["arithmetic", "ecdh"], optional = true }
# JOSE content-encryption / key-wrap primitives (`jose` feature).
aes = { version = "0.9", optional = true }
# A128GCM / A256GCM, the JWE `enc` values of OpenID4VP `direct_post.jwt`.
aes-gcm = { version = "0.11", default-features = false, features = ["aes"], optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
hmac = { version = "0.13", optional = true }
subtle = { version = "2", optional = true }
ml-dsa = { version = "0.1.0", features = ["rand_core", "zeroize"], optional = true }
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"], optional = true }
# rand 0.10 / rand_core 0.10 is shared by every primitive here (dalek 3,
# RustCrypto 0.14 curves, ml-dsa, slh-dsa via `signature` v3).
rand_10 = { package = "rand", version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
