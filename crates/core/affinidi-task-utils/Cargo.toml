[package]
name = "affinidi-task-utils"
description = "Background-task supervision: restart-on-failure with capped backoff and an observable health registry, for long-lived tokio tasks."
version = "0.1.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "tokio", "supervision", "tasks"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { workspace = true, features = ["default", "serde"] }
dashmap = "6"
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-util = "0.7"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "test-util",
] }

[lints]
workspace = true
