[package]
name = "affinidi-secrets-resolver"
description = "Common utilities for Affinidi Trust Development Kit."
version = "0.5.19"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["p256", "k256", "p384", "p521", "ed25519"]
p256 = ["affinidi-crypto/p256"]
k256 = ["affinidi-crypto/k256"]
p384 = ["affinidi-crypto/p384"]
p521 = ["affinidi-crypto/p521"]
ed25519 = ["affinidi-crypto/ed25519"]
# Post-quantum cryptography (experimental). Off by default.
post-quantum = ["ml-dsa", "slh-dsa"]
ml-dsa = ["affinidi-crypto/ml-dsa"]
slh-dsa = ["affinidi-crypto/slh-dsa"]

[dependencies]
affinidi-crypto = "0.3.2"
affinidi-encoding = "0.1.7"
ahash.workspace = true
base58 = "0.2"
base64.workspace = true
multibase = "0.9"
rand.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
unsigned-varint = "0.8"
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Never imported: these only switch on the browser entropy backend. 0.4 is for
# rand 0.10; 0.3 is for ahash 0.8's `runtime-rng`. Drop the 0.3 line only when
# `cargo tree --target wasm32-unknown-unknown -i getrandom@0.3` is empty.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
