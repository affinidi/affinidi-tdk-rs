[package]
name = "affinidi-bbs"
description = "BBS Signatures (IETF draft-irtf-cfrg-bbs-signatures) implementation over BLS12-381."
version = "0.5.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "bbs", "zero-knowledge", "disclosure"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[example]]
name = "bbs_selective_disclosure"
path = "examples/bbs_selective_disclosure.rs"

[dependencies]
# The curve stack comes from `bls12_381_plus`'s own re-exports
# (`bls12_381_plus::{elliptic_curve, ff, group}`) rather than from separate
# declarations here, so the types always match the crate whose functions
# consume them (#775).
#
# Since bls12_381_plus 0.10 the whole stack is one RustCrypto generation:
# hash-to-curve comes from `hash2curve` 0.14 (what `G1Projective::hash`
# takes), and `sha2` is the workspace's 0.11.
bls12_381_plus = { version = "0.10", features = ["alloc"] }
hash2curve = { version = "0.14", default-features = false }
hex.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
## TI7: shared test-vector loader. Path-only (no version) dev-dep — dropped
## from the published manifest, so this never reaches crates.io.
affinidi-tdk-test-support = { path = "../../tdk/affinidi-tdk-test-support" }

[lints]
workspace = true
