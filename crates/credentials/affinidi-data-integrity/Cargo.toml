[package]
name = "affinidi-data-integrity"
description = "W3C Data Integrity Implementation"
version = "0.7.13"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
bbs-2023 = ["dep:affinidi-bbs", "dep:hmac", "dep:ciborium"]
# Post-quantum cryptography (experimental — W3C di-quantum-safe v0.3).
# Off by default.
post-quantum = ["ml-dsa", "slh-dsa"]
ml-dsa = ["affinidi-crypto/ml-dsa", "affinidi-secrets-resolver/ml-dsa"]
slh-dsa = ["affinidi-crypto/slh-dsa", "affinidi-secrets-resolver/slh-dsa"]

[dependencies]
affinidi-crypto = "0.2"
affinidi-rdf-encoding = { version = "0.1", path = "../affinidi-rdf-encoding" }
affinidi-secrets-resolver = "0.5"
affinidi-did-common = "0.4"
affinidi-bbs = { version = "0.3", path = "../../core/affinidi-bbs", optional = true }
hmac = { version = "0.13", optional = true }
ciborium = { version = "0.2", optional = true }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "3"
multibase = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
zeroize = "1.8"

[dev-dependencies]
# A dev-dependency on this crate itself, enabling `ml-dsa` for test/bench/example
# builds only. This is what makes the post-quantum tests actually run.
#
# `no_suite_for_key_type` asserts that ML-DSA-44 *has* a Data Integrity suite and
# ML-DSA-65 does not — a distinction that only exists when `ml-dsa` is on.
# Without this the test compiled only by accident, when a workspace-wide build
# unified `affinidi-secrets-resolver/ml-dsa` on from elsewhere while this crate's
# own `ml-dsa` stayed off. In that state `Secret::generate_ml_dsa_44` existed but
# `CryptoSuite::default_for_key_type`'s ML-DSA arm was cfg'd out, so the test
# failed against a library that was behaving correctly for how it was built.
#
# `required-features` on the test target was the other candidate and is not
# enough on its own: it would make the test *skip* under the default feature set
# CI runs, turning a visible failure into a test nobody executes.
affinidi-data-integrity = { path = ".", features = ["ml-dsa"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "valuable",
] }

[[bench]]
name = "proof_benchmarks"
harness = false

[[example]]
name = "remote_signer_ml_dsa"
required-features = ["ml-dsa"]

[[example]]
name = "sign_multi_hybrid"
required-features = ["ml-dsa"]
