[package]
name = "affinidi-status-list-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64 = "0.23"
serde_json = "1"
affinidi-status-list = { path = ".." }

[[bin]]
name = "bitstring"
path = "fuzz_targets/bitstring.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

# Standalone workspace: cargo-fuzz needs nightly, the parent pins stable.
# Keeping this detached means the parent's `cargo build --workspace`, lints and
# publish checks never touch it.
[workspace]
