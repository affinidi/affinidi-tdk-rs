[package]
name = "affinidi-status-list"
description = "Credential status and revocation lists (Bitstring Status List, IETF Token Status List, eIDAS ASL/ARL)."
version = "0.2.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "status-list", "revocation", "sd-jwt"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# `VerifiedStatusListToken::verify_with_jws_verifier`: check a Status List
# Token's signature with affinidi-oid4vc-core's raw-bytes `JwtVerifier` (ES256,
# EdDSA, KMS-backed, ...) under an algorithm allowlist.
oid4vc = ["dep:affinidi-oid4vc-core"]

[dependencies]
# >= 0.1.4 for `decode_compact_jws_verified_with_algs`. No default features:
# only the trait and the compact-JWS decoder are used.
affinidi-oid4vc-core = { version = "0.1.12", path = "../../protocols/affinidi-oid4vc-core", default-features = false, optional = true }
base64.workspace = true
flate2 = "1"
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
affinidi-oid4vc-core = { version = "0.1.12", path = "../../protocols/affinidi-oid4vc-core", default-features = false, features = ["eddsa"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
