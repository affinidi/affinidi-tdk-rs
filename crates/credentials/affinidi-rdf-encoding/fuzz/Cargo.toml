[package]
name = "affinidi-rdf-encoding-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
affinidi-rdf-encoding = { path = ".." }

[[bin]]
name = "nquads"
path = "fuzz_targets/nquads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonld"
path = "fuzz_targets/jsonld.rs"
test = false
doc = false
bench = false

# Standalone workspace: cargo-fuzz needs nightly, the parent pins stable.
# Keeping this detached means the parent's `cargo build --workspace`, lints and
# publish checks never touch it.
[workspace]
