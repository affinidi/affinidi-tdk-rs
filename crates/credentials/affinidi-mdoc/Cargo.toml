[package]
name = "affinidi-mdoc"
description = "ISO/IEC 18013-5 mdoc (Mobile Document) implementation for mobile driving licences and eIDAS attestations."
version = "0.6.2"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "mdoc", "iso18013", "eidas"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["es256"]
_test-utils = []
es256 = ["dep:p256"]
es384 = ["dep:p384"]
eddsa = ["dep:ed25519-dalek"]
mdl = []

[[example]]
name = "mdoc_issuance"
path = "examples/mdoc_issuance.rs"
required-features = ["_test-utils"]

[[example]]
name = "mdoc_presentation"
path = "examples/mdoc_presentation.rs"
required-features = ["_test-utils"]

[dependencies]
ciborium = "0.2"
ciborium-io = "0.2"
coset = "0.4"
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
serde_json.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdsa", "arithmetic", "ecdh"], optional = true }
ed25519-dalek = { workspace = true, features = ["rand_core"], optional = true }
sha2.workspace = true
hmac = "0.13"
hkdf = "0.13"
aes-gcm = "0.11"
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
tracing.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
