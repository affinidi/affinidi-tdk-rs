[package]
name = "affinidi-mdoc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
affinidi-mdoc = { path = ".." }

[[bin]]
name = "issuer_signed"
path = "fuzz_targets/issuer_signed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "device_response"
path = "fuzz_targets/device_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engagement"
path = "fuzz_targets/engagement.rs"
test = false
doc = false
bench = false

# Standalone workspace: cargo-fuzz needs nightly, the parent pins stable.
# Keeping this detached means the parent's `cargo build --workspace`, lints and
# publish checks never touch it.
[workspace]
