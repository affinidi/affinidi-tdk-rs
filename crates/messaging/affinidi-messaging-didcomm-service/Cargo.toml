[package]
name = "affinidi-messaging-didcomm-service"
version = "0.40.0"
description = "Shared DIDComm service framework for always-online DIDComm client. Manages mediator connection, message lifecycle, and handler dispatch."
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
## Multiplex TSP alongside DIDComm on the listener's single websocket.
## Enables the SDK's TSP surface (`atm.tsp().unpack_bytes`) used to route
## inbound TSP frames to a `TspHandler`. Off by default — a DIDComm-only build
## is unaffected.
tsp = ["affinidi-messaging-sdk/tsp", "dep:affinidi-tsp"]

[dependencies]
# did:scid sender comparison (`scid` module, 0.4.4), and DID generation for
# the `echo_server` example.
affinidi-did-common = "0.5.0"
affinidi-tdk-common = { version = "0.8.0", path = "../../tdk/affinidi-tdk-common" }
# Path + version, like every other crate in this family. It was a bare
# registry requirement, so this crate compiled against the *published* SDK
# rather than the workspace one — which is how a third `trust-tasks-rs` node
# survived the 0.12 move and produced `expected MediatorAcl, found a different
# MediatorAcl` from inside this workspace.
affinidi-messaging-sdk = { version = "0.52.0", path = "../affinidi-messaging-sdk" }
# `ConnState`, the transport connection state `ATMProfile::connection_state`
# publishes (followed by the listener, R6.2).
affinidi-messaging-core = { version = "0.1.13", path = "../affinidi-messaging-core" }
affinidi-messaging-didcomm = "0.16.0"
affinidi-secrets-resolver = "0.6.0"
## Reads the cleartext sender VID off a TSP envelope, to keep each peer's
## inbound frames in order (`tsp` feature only).
affinidi-tsp = { version = "0.5.0", path = "../affinidi-tsp", optional = true }

async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha256 = "1"
regex = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true, features = ["valuable"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"

[lints]
workspace = true
