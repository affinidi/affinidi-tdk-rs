[package]
name = "affinidi-messaging-text-client"
version = "0.13.0"
description = "Affinidi Messaging SDK"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish = false
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Affinidi Crates
affinidi-tdk = { path = "../../tdk/affinidi-tdk", version = "0.49.0" }
affinidi-messaging-sdk = { path = "../affinidi-messaging-sdk", version = "0.50.0" }
affinidi-messaging-didcomm = { path = "../affinidi-messaging-didcomm", version = "0.16.0" }
affinidi-did-resolver-cache-sdk = "0.9.0"

# External Crates
ahash = { workspace = true, features = ["serde"] }
anyhow = '1.0'
base64.workspace = true
chrono = { workspace = true, features = ["default"] }
circular-queue = { version = "0.2", features = ["serde_support"] }
# Crossterm must match the version used in ratatui
crossterm = { version = "0.29", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "rayon"] }
log = "0.4"
qrcode = "0.14"
rand.workspace = true
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha256 = "1"
textwrap = "0.16"
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1"
tracing = { workspace = true, features = ["valuable"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "valuable"] }
tui-input = { version = "0.15", features = ["ratatui-crossterm"] }
tui-logger = { version = "0.18", features = ["tracing-support"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[lints]
workspace = true
