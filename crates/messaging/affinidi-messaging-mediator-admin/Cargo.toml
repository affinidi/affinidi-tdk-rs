[package]
name = "affinidi-messaging-mediator-admin"
version = "0.1.6"
description = "Headless client for operating an Affinidi messaging mediator over Trust Tasks — mediator-wide administration or an account's own queues, plus the live traffic monitor. The engine behind the mediator console; embeddable in any application."
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[dependencies]
affinidi-messaging-sdk = { version = "0.26.25", path = "../affinidi-messaging-sdk" }
affinidi-messaging-didcomm = { version = "0.15", path = "../affinidi-messaging-didcomm" }
affinidi-tdk-common = "0.6"
affinidi-secrets-resolver = "0.5"
trust-tasks-rs = "0.21.20"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha256 = "1"
thiserror = "2"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
affinidi-messaging-test-mediator = { path = "../affinidi-messaging-test-mediator" }
affinidi-messaging-mediator-common = { path = "../affinidi-messaging-mediator/affinidi-messaging-mediator-common" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
