[package]
name = "affinidi-tsp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Default features pull in the DID resolver (network client, tokio); the wire
# decoders and `unpack` need none of it.
affinidi-tsp = { path = "..", default-features = false }

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpack"
path = "fuzz_targets/unpack.rs"
test = false
doc = false
bench = false

# Standalone workspace: cargo-fuzz needs nightly, the parent pins stable.
# Keeping this detached means the parent's `cargo build --workspace`, lints and
# publish checks never touch it.
[workspace]
