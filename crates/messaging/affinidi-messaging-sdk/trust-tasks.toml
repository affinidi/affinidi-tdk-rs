"messaging/message/delete" = "0.1"
"messaging/message/get" = "0.1"
"messaging/message/list" = "0.1"
"messaging/message/status" = "0.1"
"messaging/monitor/event" = "0.1"
"messaging/monitor/subscribe" = "0.1"
