[package]
name = "affinidi-messaging-mediator-types"
version = "0.1.0"
description = "Protocol types shared by the Affinidi Messaging Mediator and its clients (ACLs, problem reports, message pickup, accounts)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[features]
## Log a system clock set before the UNIX epoch from `SystemClock` (it falls
## back to 0 either way). The mediator turns this on; the SDK leaves it off.
tracing = ["dep:tracing"]

## Compiles `clock::TestClock`, a manually-advanced clock for fast
## expiry/TTL/session tests. NON-DEFAULT and never enabled by the mediator
## binary, so the advanceable clock can't reach a production build. Test
## harnesses (e.g. affinidi-messaging-test-mediator) opt in through
## `affinidi-messaging-mediator-common/test-clock`.
test-clock = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tracing = { version = "0.1", optional = true }

[lints]
workspace = true
