### Mediator Configuration
###
### Every setting can be overridden by an environment variable.
### The env var name is shown in the "Env:" line above each field.
### Environment variables take priority over values in this file.

### log_level: trace debug info warn error
### NOTE: RUST_LOG environment variable can also override this setting
log_level = "info"

### Env: LOG_JSON
### If true, log output will be in JSON format
log_json = "false"

### Env: MEDIATOR_DID
### DID of the mediator (REQUIRED in self-hosted mode; optional otherwise).
### When VTA integration is enabled (admin credential present in the secret
### backend), the mediator uses the DID recorded on the VTA context and
### this field is ignored.
### Supported formats:
###   did://<did_string>
###   aws_parameter_store://<parameter_name>[?region=<region>]
### A hierarchical parameter name keeps its leading slash, so it reads as
### three slashes: aws_parameter_store:///mediator/did?region=eu-west-1
### Without ?region= the ambient AWS region is used (AWS_REGION, profile,
### then IMDS). The mediator-setup wizard publishes to this exact format.
mediator_did = "did://did:peer:2.Vz6MkksX9huJxJwvLtj9vc3gXbT2m1WVy4Uoi3ssEiSSH2ZYJ.EzQ3shVZJV9gKezYsvy5tC1LCwjjWSms2zCfZhvnRK48BNoHH3"

### ****************************************************************************************************************************
### Unified secret storage
###
### Every sensitive value the mediator reads — admin credential, JWT
### signing key, operating keys, VTA cache — lives under one backend.
### Pick the `backend` URL and everything is automatic from there.
###
### Supported backends:
###   keyring://<service>                   OS keyring (macOS Keychain,
###                                         Linux Secret Service, Windows
###                                         Credential Manager).
###   file:///<absolute-path>[?encrypt=1]   Local JSON file (plaintext by
###                                         default — DEV/TEST ONLY).
###   aws_secrets://<region>/<prefix>       AWS Secrets Manager.
###   gcp_secrets://<project>/<prefix>      GCP Secret Manager (coming soon).
###   azure_keyvault://<vault>              Azure Key Vault (coming soon).
###   vault://<host[:port]>/<kv-path>       HashiCorp Vault (coming soon).
###
### Env: MEDIATOR_SECRETS_BACKEND
### ****************************************************************************************************************************
[secrets]
backend = "keyring://affinidi-mediator"

### Env: MEDIATOR_SECRETS_CACHE_TTL
### Maximum age for the cached VTA bundle (humantime format). `0` means
### no expiry — keep the cache until manually invalidated or a fresh
### fetch overwrites it. Default: 30 days.
# cache_ttl = "30d"
### ****************************************************************************************************************************
### Server configuration
### ****************************************************************************************************************************
[server]
### Env: LISTEN_ADDRESS
### <ip_address>:<tcp_port> that this service will listen on
listen_address = "0.0.0.0:7037"

### Env: API_PREFIX
### API prefix the mediator's HTTP routes mount under. Leading/trailing slashes
### are normalised, so all of the following are accepted and equivalent:
###   "/mediator/v1/"  "/mediator/v1"  "mediator/v1"
### Use ""  or "/"  to mount routes at the host root (no prefix).
api_prefix = "/mediator/v1/"

### Env: ADMIN_DID
### DID of the admin (REQUIRED)
### NOTE: It is strongly recommended to NOT use the same DID as the mediator!
###       This causes more use cases where the secrets of the mediator itself can be exposed in administration tasks.
### NOTE: You can add additional admin DIDs after startup via the DIDComm admin protocol
admin_did = "did://did:peer:2.Vz6MkksX9huJxJwvLtj9vc3gXbT2m1WVy4Uoi3ssEiSSH2ZYJ.EzQ3shVZJV9gKezYsvy5tC1LCwjjWSms2zCfZhvnRK48BNoHH3"

### Env: DID_WEB_SELF_HOSTED
### Path to the self-hosted DID Document
### Supported formats:
###   file://<path>
###   aws_parameter_store://<parameter_name>[?region=<region>]
### When enabled, adds a did:web route at /.well-known/did.json.
### Inactive by default — uncomment only when this mediator should
### serve its own DID document/log (e.g. did:webvh self-hosted at
### the same domain as the public URL). The setup wizard activates
### this line automatically when the public URL host and the DID's
### host match; otherwise it leaves it commented out.
# did_web_self_hosted = "file://./conf/did.jsonl"

### Public service URL(s) at which this mediator is reachable. The
### Routing 2.0 forward handler uses these (plus `listen_address`) to
### detect when an outbound forward's next hop is itself, and short-
### circuits to local delivery instead of opening a remote socket.
###
### When `listen_address` is bound to a wildcard (`0.0.0.0` / `::`)
### — which is the default — DID-Doc service URIs will never literally
### match the bind address, so set this to the public URL(s) you publish
### in the mediator's DID Doc. Each entry must be a parseable URL with
### scheme + host (port optional; falls back to the scheme default).
###
### Hostnames are compared case-insensitively; IPv6 literals are
### normalized so a bracketed URL form (`http://[::1]:7037`) matches a
### bind address recorded as `::1`.
###
### Env: LOCAL_ENDPOINTS — comma-separated (the TOML form is an array);
### an empty value clears the list.
# local_endpoints = ["https://mediator.example.com", "https://mediator.example.com:7037"]

### ****************************************************************************************************************************
### Database configuration
### ****************************************************************************************************************************
[database]
### Env: DATABASE_FUNCTIONS_FILE
### Path to the database functions file
functions_file = "./atm-functions.lua"

### Env: DATABASE_URL
### URL of the Redis compatible database
### Supported schemes:
###   redis://127.0.0.1/                    — local, no auth (dev only)
###   redis://:password@host:6379/          — with password authentication
###   redis://user:password@host:6379/      — with ACL user + password
###   rediss://:password@host:6379/         — TLS encrypted connection
###   redis://127.0.0.1/1                   — use database partition 1
### SECURITY: Always use authentication (requirepass or ACLs) in production.
### For remote Redis, use rediss:// (TLS) to encrypt data in transit.
database_url = "redis://127.0.0.1/"

### Env: DATABASE_TIMEOUT
### Timeout for database operations in seconds
database_timeout = "2"

### ****************************************************************************************************************************
### Security configuration
### ****************************************************************************************************************************
[security]
### Env: MEDIATOR_ACL_MODE
### Whether the mediator is open or closed to unknown DIDs:
###   explicit_deny  — OPEN. Any DID may authenticate; unknown DIDs are
###                    auto-registered with global_acl_default. Any
###                    authenticated DID may also pre-register other DIDs via
###                    account_add (always created with global_acl_default,
###                    never wider).
###   explicit_allow — CLOSED. Only DIDs pre-registered by an admin may
###                    authenticate; an unknown DID is rejected at the
###                    challenge step. Only admin accounts may add accounts.
###
### In explicit_deny mode, `global_acl_default` is the setting that controls
### what an arbitrary self-registered DID may do. See docs/acls.md.
mediator_acl_mode = "explicit_deny"

### Env: GLOBAL_DEFAULT_ACL
### Default ACL applied to new/unknown DIDs. THIS is the real access control
### for a public mediator: it decides what every self-registered DID may do,
### and seeds each DID's own access-list mode.
### NOTE: ALLOW_ALL or DENY_ALL must always be first, followed by comma-separated flags
### Flags: LOCAL, SEND_MESSAGES, RECEIVE_MESSAGES, SEND_FORWARDED, RECEIVE_FORWARDED,
###        CREATE_INVITES, ANON_RECEIVE, SELF_MANAGE_LIST, SELF_MANAGE_SEND_QUEUE_LIMIT,
###        SELF_MANAGE_RECEIVE_QUEUE_LIMIT (and _CHANGE variants)
global_acl_default = "DENY_ALL,LOCAL,SEND_MESSAGES,RECEIVE_MESSAGES"

### Env: LOCAL_DIRECT_DELIVERY_ALLOWED
### If true, messages addressed directly to a local DID will be delivered
local_direct_delivery_allowed = "true"

### Env: LOCAL_DIRECT_DELIVERY_ALLOW_ANON
### If true, anonymous messages can be delivered directly to a local DID
local_direct_delivery_allow_anon = "false"

### NOTE: `mediator_secrets` was removed. Operating keys now live in the
### unified `[secrets]` backend at well-known keys
### (`mediator/operating/signing`, `mediator/operating/key_agreement`) —
### or are fetched from the VTA at startup when VTA integration is enabled
### (indicated by the presence of `mediator/admin/credential`).

### Env: USE_SSL
### If true, SSL is enabled. Set to false only if TLS is terminated externally
use_ssl = "false"

### Env: SSL_CERTIFICATE_FILE
### Path to the SSL certificate file
ssl_certificate_file = "keys/end.cert"

### Env: SSL_KEY_FILE
### Path to the SSL certificate key file
ssl_key_file = "keys/end.key"

### JWT signing key is no longer a config field — it lives in the unified
### `[secrets]` backend under the well-known key `mediator/jwt/secret` and
### is provisioned by the setup wizard or `mediator rotate-jwt`.

### Env: JWT_ACCESS_EXPIRY
### Expiry time in seconds for JWT access tokens (minimum: 10)
jwt_access_expiry = "900"

### Env: JWT_REFRESH_EXPIRY
### Expiry time in seconds for JWT refresh tokens
jwt_refresh_expiry = "86400"

### Env: CORS_ALLOW_ORIGIN
### Controls cross-origin browser access on the REST endpoints. Leave
### unset (the default) to disable cross-origin access entirely.
###
### Accepts either:
###   - a comma-separated allowlist whose entries are each one of:
###       * an exact, scheme-qualified origin, echoed back in
###         `Access-Control-Allow-Origin` only for a matching request
###         Origin, e.g. "https://affinidi.com,https://example2.com"; or
###       * a leftmost-label sub-domain wildcard, e.g.
###         "https://*.affinidi.com". This matches any sub-domain of
###         affinidi.com at any depth (app.affinidi.com, a.b.affinidi.com)
###         and echoes back the exact request Origin that matched. The
###         scheme and port must match exactly (pin a port with
###         "https://*.affinidi.com:8443"); the '*' is only valid as the
###         entire leftmost host label. NOTE: a wildcard does NOT cover
###         its own apex — "https://*.affinidi.com" does not match
###         "https://affinidi.com"; add the apex explicitly if needed.
###     (The CORS spec's Access-Control-Allow-Origin header has no
###     wildcard-subdomain form; the mediator implements "*.suffix" by
###     matching the request Origin and echoing the exact match.)
###   - a single "*" to allow ANY origin. A wildcard is safe here only
###     because these endpoints authenticate with a bearer token in the
###     `Authorization` header (not an ambient cookie): a cross-origin
###     page still needs a valid token, so "*" does not create CSRF
###     exposure. `allow_credentials` is never set.
###
### The mediator also applies this allowlist as a defence-in-depth
### `Origin` check on the WebSocket upgrade (/ws): an upgrade carrying a
### non-allowlisted Origin is refused. A client sending NO Origin is
### admitted — for it the JWT is the gate.
###
### The distinction is the header, not whether the client is a browser.
### This note used to say "header-less native clients are unaffected",
### which reads as "native clients are unaffected" and is false for the
### case that matters: REACT NATIVE'S WEBSOCKET SENDS AN ORIGIN derived
### from the URL, so a mobile wallet is refused by the default policy
### exactly as a browser would be, with
### `WebSocket upgrade rejected: Origin not permitted by CORS policy`.
### If you are deploying for a mobile wallet, you must set this — see
### docs/cors-and-origin.md.
###
### Operational note: with the browser WebSocket auth path the JWT
### travels in the `Sec-WebSocket-Protocol` request header. Over wss://
### it is TLS-encrypted in transit and the mediator never logs it, but
### configure any fronting proxy/load-balancer NOT to log
### `Sec-WebSocket-Protocol` request headers (as you would already
### redact `Authorization`). Short access-token TTLs (jwt_access_expiry)
### further limit exposure.
# cors_allow_origin = "https://affinidi.com"

### Env: BLOCK_ANONYMOUS_OUTER_ENVELOPE
### If true, all messages sent to the mediator must be signed
block_anonymous_outer_envelope = "true"

### Env: FORCE_SESSION_DID_MATCH
### If true, the signing DID in the outer envelope MUST match the session DID
### Must be false if block_anonymous_outer_envelope is false
force_session_did_match = "true"

### Env: BLOCK_REMOTE_ADMIN_MSGS
### If true, admin messages must be delivered directly (not via another mediator)
block_remote_admin_msgs = "true"

### Env: ADMIN_MESSAGES_EXPIRY
### TTL in seconds for admin messages (minimizes replay attack risk)
admin_messages_expiry = "3"

### Env: ENABLE_INTER_MEDIATOR_RELAY
### Explicitly act as an inter-mediator relay (accept anonymous /inbound
### forwards from other mediators). Defaults to "false".
### NOTE: today relay is also permitted when global_acl_default grants
### SEND_FORWARDED even without this flag (you'll see a deprecation warning at
### boot). A future release will require this flag to be "true" for relay.
enable_inter_mediator_relay = "false"

### ****************************************************************************************************************************
### Live streaming setup
### ****************************************************************************************************************************
[streaming]
### Env: STREAMING_ENABLED
### If true, enables live message streaming via WebSockets
enabled = "true"

### Env: STREAMING_UUID
### Unique identifier for this subscriber instance
### Formats: hostname:// | string://<uuid>
uuid = "hostname://"

### ****************************************************************************************************************************
### DID Resolver configuration
### ****************************************************************************************************************************
[did_resolver]
### Env: DID_RESOLVER_ADDRESS
### Address of the DID resolver service (omit to use local resolver)
# address = "ws://127.0.0.1:8080/did/v1/ws"

### Env: DID_RESOLVER_CACHE_CAPACITY
### Number of DIDs to cache in memory
cache_capacity = "1000"

### Env: DID_RESOLVER_CACHE_TTL
### TTL in seconds for cached DIDs
cache_ttl = "300"

### Env: DID_RESOLVER_NETWORK_TIMEOUT
### Timeout in milliseconds for DID resolution (account for blockchain latency)
network_timeout = "5000"

### Env: DID_RESOLVER_NETWORK_LIMIT
### Maximum concurrent DID resolution requests
network_limit = "100"

### ****************************************************************************************************************************
### Resource limits
### ****************************************************************************************************************************
[limits]
### These are OPERATIONAL limits — tune them to your deployment; the defaults are
### NOT protocol constants. They suit a small-to-medium single-node mediator.
### Every value is overridable at runtime via the listed `Env:` variable (env
### wins over this file). Each entry notes what it protects and a `Scale:` hint
### for when to raise or lower it.

### Env: LIMIT_ATTACHMENTS_MAX_COUNT
### Maximum attachments accepted on a single message.
### Scale: raise for clients that batch many attachments per message; each one
### adds unpack + crypto work, so weigh against crypto_operations_per_message.
attachments_max_count = "20"

### Env: LIMIT_CRYPTO_OPERATIONS_PER_MESSAGE
### Protects against DoS attacks via excessive crypto operations.
### Scale: the main per-message CPU guard (caps recipients x keys). Raise only if
### legitimate traffic is fan-out heavy; higher = more CPU per message under load.
crypto_operations_per_message = "1000"

### Env: LIMIT_DELETED_MESSAGES
### Maximum messages that can be deleted at once.
### Scale: raise to cut round-trips for clients clearing large inboxes; higher =
### a larger single storage transaction per delete call.
deleted_messages = "100"

### Env: LIMIT_FORWARD_TASK_QUEUE
### Maximum queued forward tasks.
### Scale: raise for relay/hub mediators with bursty forward volume; the queue
### lives in the storage backend, so this is bounded by backend memory/disk.
forward_task_queue = "50000"

### Env: LIMIT_HTTP_SIZE
### Maximum HTTP request payload in bytes (10MB).
### Scale: raise for large-attachment use cases; keep >= message_size; higher =
### more memory buffered per in-flight request.
http_size = "10485760"

### Env: LIMIT_LISTED_MESSAGES
### Maximum messages listed at a time.
### Scale: raise to reduce pagination round-trips for busy inboxes; higher =
### larger list responses (memory + bandwidth per call).
listed_messages = "100"

### Env: LIMIT_LOCAL_MAX_ACL
### Maximum ACL entries per DID.
### Scale: raise for DIDs that maintain large allow/deny lists; each entry is one
### stored set member (cheap individually; this caps unbounded growth).
local_max_acl = "1000"

### Env: LIMIT_MESSAGE_EXPIRY_SECONDS
### TTL in seconds for stored messages (7 days).
### Scale: lower to cap storage growth on high-volume mediators; raise for
### recipients that poll infrequently and must not miss messages.
message_expiry_seconds = "604800"

### Env: LIMIT_DELIVERED_EXPIRY_SECONDS
### TTL in seconds for a message that has ALREADY been handed to its recipient,
### counted from that first handover. "0" (the default) means no different from
### any other message.
###
### Why you might set it: a message the recipient has collected but not
### acknowledged is held for the full `message_expiry_seconds` above, and held
### AGAINST ITS SENDER, counting toward that sender's queue-depth limits the
### whole time. For a recipient that collected it and simply never
### acknowledged, that is a week of a sender's allowance spent on work that is
### already done.
###
### Why it is off by default: shortening it is a real reduction in durability,
### not a free win. A message can be marked delivered and still not have
### reached an application — the delivery layer deliberately does NOT
### acknowledge a message that reached no consumer, precisely so the mediator
### redelivers it. Set this shorter than a client's worst restart window and
### you will destroy exactly those messages.
###
### Scale: if you set it, set it well above how long your slowest client can be
### down and still expect its mail. 86400 (one day) is a reasonable starting
### point for clients that reconnect within minutes; there is no safe value for
### a fleet with clients that are offline for days.
###
### Watch `messages_delivered_expiry_advanced_total` to see how often it
### applies, and `messages_poison_suspected_total` to tell a recipient that
### never came back from one that keeps collecting and never finishing.
delivered_expiry_seconds = "0"

### Env: LIMIT_PICKUP_ROUND_ROBIN
### Give each sender a turn on pickup instead of serving an inbox strictly
### head-first. "true" by default.
###
### Why it is on: an inbox is arrival-ordered, so a sender that queued fifty
### messages ahead of another's is fifty messages a recipient must collect
### before it sees the second — and if it cannot process them and does not
### delete them, it never does. The per-relationship cap bounds how bad that
### gets; it does not change the shape.
###
### What it does NOT change: order WITHIN a sender is preserved exactly. Only
### the interleaving between senders changes, and nothing guarantees that —
### two senders' messages reach a mediator in whatever order the network
### delivered them. A recipient that talks to one peer sees byte-identical
### results.
###
### Cost: one extra listing per pickup. The listing window is bounded
### (10x the caller's limit, capped at 500), so it does not grow with the
### queue.
###
### A caller paging with `start_id` always gets stream order regardless, because
### a round-robin selection is not a contiguous range and "continue after the
### last id" would silently skip messages.
###
### Turn it off only if a client genuinely depends on cross-sender arrival
### order.
pickup_round_robin = "true"

### Env: LIMIT_MESSAGE_SIZE
### Maximum message size in bytes (1MB).
### Scale: raise for large-payload workloads; keep <= http_size and ws_size;
### higher = more memory per message and per queued copy.
message_size = "1048576"

### Env: LIMIT_QUEUED_SEND_MESSAGES_PER_PEER
### How many messages one sender may have queued for one SPECIFIC recipient
### (-1 = no limit). This is the gate that catches a sender flooding a peer.
### Scale: raise for senders that legitimately burst at a single recipient;
### the per-DID totals below cannot distinguish that from fan-out, so this is
### the limit to tune, not those.
queued_send_messages_per_peer = "50"

### Env: LIMIT_QUEUED_SEND_MESSAGES_SOFT
### Default outbound queue limit per DID, summed across ALL recipients
### (-1 = no limit).
### A coarse ceiling only. It cannot tell a community holding one uncollected
### card for each of 200 members from a sender aiming 200 messages at one
### victim, so it is deliberately set well above normal fan-out and
### `queued_send_messages_per_peer` above does the real work. It is also not
### the storage bound: every queued message is counted in exactly one
### recipient's inbox, so the receive limits bound total storage on their own.
### `soft` is the default, `hard` (below) is the max a non-admin may set.
queued_send_messages_soft = "2000"

### Env: LIMIT_QUEUED_SEND_MESSAGES_HARD
### Maximum outbound queue limit settable by non-admin (-1 = no limit).
### Scale: per-DID outbound ceiling; raise for high-throughput senders. MUST be
### >= queued_send_messages_soft, which is the default every account starts on —
### a hard below soft means the default exceeds the maximum an account may set.
### Headroom here is what lets a large community raise its own limit: with soft
### at 2000, a community with more than 2000 members awaiting collection needs
### to.
queued_send_messages_hard = "10000"

### Env: LIMIT_QUEUED_RECEIVE_MESSAGES_SOFT
### Default inbound queue limit per DID (-1 = no limit).
### Scale: raise for DIDs that receive bursts while offline (store-and-forward).
queued_receive_messages_soft = "200"

### Env: LIMIT_QUEUED_RECEIVE_MESSAGES_HARD
### Maximum inbound queue limit settable by non-admin (-1 = no limit).
### Scale: per-DID inbox cap; raise for offline-heavy clients. Bounds worst-case
### backend storage per DID (this x message_size).
queued_receive_messages_hard = "1000"

### NOT A SETTING — how the two `hard` limits above bound the Redis streams.
###
### On the Redis backend the per-DID inbox and outbox streams carry a MAXLEN,
### derived as (larger of the two hard limits) + 1 — strictly above both, and
### 0 (no trimming) if either is -1. It is derived rather than configured
### because it MUST sit above them: a trim removes a stream entry while the
### queue counters keep counting it, so a DID past the trim is refused by
### counters for messages it can no longer list or purge, recovering only when
### the message TTL expires. Raising a hard limit therefore moves the stream
### bound with it automatically; there is no second number to remember.
###
### Residual: an account granted -1 or -2 (unlimited) is not clamped to the
### hard limit, so no finite bound sits above it and trimming can still reach
### such an account. That is a property of choosing unlimited.

### Env: LIMIT_TO_KEYS_PER_DID
### Maximum keys per recipient DID (DoS protection).
### Scale: rarely needs changing; only raise for recipients that legitimately
### publish many key-agreement keys.
to_keys_per_recipient = "100"

### Env: LIMIT_TO_RECIPIENTS
### Maximum recipients per message (DoS protection).
### Scale: raise for group/broadcast messaging; each recipient multiplies fan-out
### work and stored copies, so this interacts with crypto_operations_per_message.
to_recipients = "100"

### Env: LIMIT_WS_SIZE
### Maximum WebSocket payload in bytes (10MB).
### Scale: mirror http_size; raise for large streamed payloads. Higher = more
### memory buffered per WebSocket frame.
ws_size = "10485760"

### Env: ACCESS_LIST_LIMIT
### Maximum access list entries per DID.
### Scale: raise for DIDs with large allow/deny lists (companion to
### local_max_acl); each entry is one stored set member.
access_list_limit = "1000"

### Env: OOB_INVITE_TTL
### TTL in seconds for OOB invites (24h).
### Scale: lower for tighter, short-lived invite windows; raise if invites are
### distributed out-of-band slowly (e.g. printed/QR onboarding).
oob_invite_ttl = "86400"

### Env: LIMIT_RATE_LIMIT_PER_IP
### Requests per second per IP (0 = disabled). A refusal is HTTP 429 with
### `x-rate-limit-source: mediator`, `Retry-After` and a JSON body, so clients
### can tell this limit from a proxy's or another service's.
### Scale: lower to harden against per-IP abuse; RAISE (or disable) when behind a
### trusted load balancer / NAT where many clients share one source IP, or it
### will throttle legitimate traffic. Commented out = built-in default (100).
# rate_limit_per_ip = "100"

### Env: LIMIT_RATE_LIMIT_BURST
### Burst size for IP-based rate limiting.
### Scale: raise to tolerate bursty-but-legitimate traffic without 429s — this is
### the token-bucket depth above the steady per-IP rate.
# rate_limit_burst = "50"

### Env: LIMIT_MAX_WEBSOCKET_CONNECTIONS
### Maximum concurrent WebSocket connections (0 = unlimited).
### Scale: size to expected concurrent clients plus headroom; ultimately bounded
### by the process file-descriptor limit and memory. Commented out = default
### (10000).
# max_websocket_connections = "10000"

### Env: LIMIT_MAX_WEBSOCKET_CONNECTIONS_PER_DID
### Maximum concurrent WebSocket connections for a single DID, so one DID
### can't exhaust the global max_websocket_connections budget (0 = unlimited).
### Scale: raise for DIDs running many devices/clients, but keep well below the
### global cap so one DID can't starve others. Commented out = default (100).
# max_websocket_connections_per_did = "100"

### Env: LIMIT_DID_RATE_LIMIT_PER_SECOND
### Requests per second per authenticated DID (0 = disabled).
### Charged once per authenticated HTTP request, after the JWT is validated:
### /inbound (DIDComm and TSP), /outbound, /fetch, /list, /delete, /whoami, /oob,
### /admin/status and the /ws upgrade. A refusal is a 429 with
### `x-rate-limit-source: mediator`, `Retry-After`, and a JSON body whose
### `scope` is "did" (the per-IP limiter's 429 has no `scope`). Counted in
### `rate_limited_total{scope="did"}`.
### NOT METERED: messages sent over an already-established WebSocket. Only the
### upgrade is charged; an in-session refusal has no HTTP status to carry it and
### DIDComm defines no rate-limit problem report, so none is sent. A client that
### sends over its socket is bounded by the upgrade rate and the queue limits,
### not by this key.
### Never charged: the mediator's own DID, the configured admin_did, and
### anonymous inter-mediator relay traffic (it carries no DID; the per-IP limit
### still applies).
### Scale: enable (set > 0) to throttle an abusive *authenticated* client a
### per-IP limit can't catch (e.g. one DID behind many IPs); leave 0 if per-IP
### limits suffice. Commented out = default (0/disabled).
# did_rate_limit_per_second = "0"

### Env: LIMIT_DID_RATE_LIMIT_BURST
### Burst size for per-DID rate limiting.
### Scale: token-bucket depth above the steady per-DID rate; raise to tolerate
### bursty authenticated clients once did_rate_limit_per_second is enabled.
# did_rate_limit_burst = "10"

### Env: LIMIT_WS_SEND_BUFFER
### Total bytes of queued live-delivery messages across ALL WebSocket
### connections (32 MiB). This is one shared pool, not a per-connection budget:
### the aggregate is capped here no matter how many clients are connected.
### When it is exhausted, live pushes are DROPPED rather than queued — not
### message loss, since the message is already durable in the recipient's inbox
### and arrives on its next poll or on reconnect. Watch
### `ws_live_delivery_dropped_total` to see if this is happening.
### Scale: raise for many concurrent live-streaming clients or large messages
### (a client's queue also caps at 8 messages); costs up to this much RSS.
# ws_send_buffer = "33554432"

### Env: LIMIT_PUBSUB_BUFFER
### Bytes reserved for the live-delivery pub/sub ring (16 MiB). The ring's slot
### count is derived as pubsub_buffer / message_size, so at the defaults it holds
### 16 messages. A ring slot stays occupied until it is overwritten, so this is a
### standing ceiling, not a transient queue.
### Scale: raise if you see "Streaming subscriber lagged" warnings under bursts —
### lagging costs a live push (the message still lands in the inbox), it does not
### lose messages. Costs up to this much RSS.
# pubsub_buffer = "16777216"

### ****************************************************************************************************************************
### Forwarding processor configuration
###
### Runs on every storage backend. Durability of queued forwards follows
### the backend: Redis and Fjall queues survive a restart (in-flight
### entries are recovered automatically); the in-memory backend loses
### queued forwards when the process exits. Scaling forwarding across
### multiple processes (the standalone forwarding_processor binary in
### mediator-processors) requires the Redis backend.
### ****************************************************************************************************************************
[processors.forwarding]
### Env: PROCESSOR_FORWARDING_ENABLED
### Enable the local forwarding processor
enabled = "true"

### Env: PROCESSOR_FORWARDING_FUTURE_TIME_LIMIT
### Maximum seconds a message can be scheduled in the future
future_time_limit = "86400"

### Env: PROCESSOR_FORWARDING_EXTERNAL
### If true, forward messages to external mediators/endpoints
external_forwarding = "true"

### Env: PROCESSOR_FORWARDING_REPORT_ERRORS
### If true, generate problem reports for failed forwarding
report_errors = "true"

### Env: PROCESSOR_FORWARDING_BLOCKED_DIDS
### Additional DIDs to block forwarding to (JSON array)
### Always includes the mediator's own DID
blocked_forwarding_dids = "[]"

### Env: PROCESSOR_FORWARDING_RATE_WINDOW
### Sliding window in seconds for endpoint message rate tracking
rate_window_seconds = "300"

### Env: PROCESSOR_FORWARDING_WS_THRESHOLD
### Messages per 10s threshold to prefer WebSocket over REST
ws_threshold_msgs_per_10s = "1"

### Env: PROCESSOR_FORWARDING_WS_IDLE_TIMEOUT
### Seconds of idle time before disconnecting a remote WebSocket
ws_idle_timeout_seconds = "60"

### Env: PROCESSOR_FORWARDING_BATCH_SIZE
### Messages per batch from the forwarding queue
batch_size = "50"

### Env: PROCESSOR_FORWARDING_MAX_RETRIES
### Maximum retry attempts for failed forwarding
max_retries = "5"

### Env: PROCESSOR_FORWARDING_INITIAL_BACKOFF_MS
### Initial backoff delay in milliseconds
initial_backoff_ms = "1000"

### Env: PROCESSOR_FORWARDING_MAX_BACKOFF_MS
### Maximum backoff delay in milliseconds
max_backoff_ms = "60000"

### Env: PROCESSOR_FORWARDING_CONSUMER_GROUP
### Consumer group name for the forwarding queue. On Redis this is the
### stream consumer group shared across processor instances; on Fjall and
### in-memory backends it names the single in-process group.
consumer_group = "forwarding"

### Env: PROCESSOR_FORWARDING_MAX_HOPS
### Maximum relay hops before a forward is rejected as a loop. Counts every
### mediator-to-mediator hop, and is also the depth limit when peeling
### re-wrap layers.
max_hops = "10"

### Env: PROCESSOR_FORWARDING_RELAY_MODE
### How to relay a forward whose next hop is a *remote* mediator:
###   "blind"  (default) — relay the inner envelope unchanged. The inner
###            envelope (incl. the original sender's key id) is visible on the
###            wire and the receiving mediator cannot identify the relaying peer.
###   "rewrap" — re-encrypt the inner envelope for the next mediator, authcrypted
###            from THIS mediator. Hides the sender/inner envelope from the wire
###            and lets the receiving mediator authenticate & allowlist the peer
###            mediator. BOTH mediators in the pair must use "rewrap".
relay_mode = "blind"

### Env: PROCESSOR_FORWARDING_RELAY_TRUSTED_MEDIATORS
### Comma-separated allowlist of peer-mediator DIDs whose re-wrapped relays this
### mediator will accept (rewrap mode only). Empty = accept any peer (still ACL
### gated). Ignored in blind mode.
relay_trusted_mediators = ""

[processors.message_expiry_cleanup]
### Env: PROCESSOR_MESSAGE_EXPIRY_CLEANUP_ENABLED
### Enable the message expiry cleanup processor
enabled = "true"

[processors.session_expiry_cleanup]
### Env: PROCESSOR_SESSION_EXPIRY_CLEANUP_ENABLED
### Reclaim expired session records on backends without native TTL
### (Fjall, in-memory). No-op on Redis, which expires sessions itself.
enabled = "true"
### ****************************************************************************************************************************
### Storage backend
### ****************************************************************************************************************************
### Absent = Redis (the historical default), configured via [database] above.
### Uncomment to run the embedded Fjall backend instead — a single-process,
### on-disk LSM store for self-hosted deployments that don't want to operate a
### separate Redis. Fjall does NOT support cross-process pub/sub, so it cannot
### run multiple mediator instances against one data directory.
###
### See docs/memory-tuning.md for the full memory model and how these interact.
# [storage]
### Env: STORAGE_BACKEND — "redis" (default) or "fjall"
# backend = "fjall"
### Env: STORAGE_DATA_DIR — required when backend = "fjall"
# data_dir = "/var/lib/mediator/data"

### ─── Fjall memory tuning ────────────────────────────────────────────────────
### Ignored unless backend = "fjall". These have no Redis equivalent: with the
### Redis backend the data lives in the Redis *server*, so its memory is governed
### by `maxmemory` / `maxmemory-policy` in redis.conf, not by the mediator.
###
### The shipped defaults hold a mediator under ~256 MB RSS. Raise them for
### throughput — all three trade memory for speed.
# [storage.fjall]

### Env: STORAGE_FJALL_BLOCK_CACHE
### Read cache for decompressed data blocks, in bytes. Default 16 MiB.
### Scale: the first knob to raise for READ throughput (message pickup, ACL
### lookups). A larger cache means fewer disk reads. Costs exactly this many
### bytes of RSS once warm.
# block_cache = "16777216"

### Env: STORAGE_FJALL_WRITE_BUFFER
### Total in-memory write buffer (memtables) across all keyspaces, in bytes.
### Default 32 MiB, divided between keyspaces by how much each one writes.
### Scale: raise for WRITE throughput — a bigger buffer means fewer, larger
### flushes to disk and less write amplification. Costs up to this many bytes of
### RSS under sustained writes.
###
### NOTE: this applies when the data directory is FIRST CREATED. Fjall persists
### each keyspace's memtable size at creation and offers no way to change it
### later, so editing this against an existing `data_dir` will not resize
### keyspaces that already exist. `max_journal` below still bounds them.
# write_buffer = "33554432"

### Env: STORAGE_FJALL_MAX_JOURNAL
### Journal size ceiling in bytes. Default 128 MiB.
### This is the real global memory bound. Fjall has NO global write-buffer cap
### (its `max_write_buffer_size` setting is a no-op in 3.1.x), and each keyspace
### only flushes when its own memtable fills. What does bound things: once the
### journal grows past this, Fjall force-flushes the keyspaces holding it open.
### Unlike write_buffer, this takes effect on every start, including on an
### existing data_dir.
### Scale: raise to reduce flush frequency (better write throughput, more RSS);
### lower to clamp memory harder at the cost of more disk I/O.
# max_journal = "134217728"
