[package]
name = "affinidi-messaging-helpers"
version = "0.13.6"
description = "CLI tools for Affinidi Messaging (mediator administration)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish = false
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

## Interactive CLI for managing mediator accounts, ACLs, and permissions.
## Requires a running mediator instance to connect to.
[[bin]]
name = "mediator_administration"
path = "src/mediator_administration/main.rs"

[dependencies]
# ── Affinidi Crates ──────────────────────────────────────────────────────
## SDK for connecting to and communicating with a running mediator
affinidi-messaging-sdk = { path = "../affinidi-messaging-sdk", version = "0.49.2" }
## Trust Tasks runtime (the `hijack_admin` example builds a `TrustTask`). The
## task types come from `affinidi_messaging_sdk::tasks`.
trust-tasks-rs = { version = "0.39", default-features = false }
## TDK for DID resolution and crypto utilities
affinidi-tdk = { path = "../../tdk/affinidi-tdk", version = "0.48" }
## DIDComm message types — used by example binaries
affinidi-crypto = { version = "0.3.2", features = ["jose"] }
affinidi-messaging-didcomm = { path = "../affinidi-messaging-didcomm", version = "0.15.15", features = ["messaging-core"] }
## Protocol-agnostic messaging-core traits — used by `unified_messaging` example
affinidi-messaging-core = { path = "../affinidi-messaging-core" }
## TSP transport — used by `unified_messaging` and `protocol_comparison` examples
affinidi-tsp = { path = "../affinidi-tsp", features = ["messaging-core"] }

# ── CLI / Interactive UI ─────────────────────────────────────────────────
clap = { workspace = true, features = ["derive"] }
## Terminal prompts (Select, Input, Confirm) with color themes
console = "0.16"
dialoguer = "0.12"

# ── Serialization ────────────────────────────────────────────────────────
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
ahash = { workspace = true, features = ["serde"] }
## Base64 encoding/decoding — used by example binaries
base64.workspace = true

# ── Utilities ────────────────────────────────────────────────────────────
regex = "1"
sha256 = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["valuable"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "valuable"] }
## UUIDs — used by example binaries (alice_bob, multi_device, etc.)
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]
## Stamps `issuedAt` on the Trust Tasks the `hijack_admin` example builds by hand
chrono = { workspace = true, features = ["clock"] }

[lints]
workspace = true
