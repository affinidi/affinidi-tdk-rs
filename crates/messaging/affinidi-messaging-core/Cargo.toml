[package]
name = "affinidi-messaging-core"
description = "Protocol-agnostic messaging traits for DIDComm and TSP"
version = "0.1.13"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
# `HttpStatusError`: the rate-limit contract body is JSON, and `Retry-After`
# may be an HTTP-date. Both are small, and already in every graph that makes
# an HTTP call (hyper depends on `httpdate`).
httpdate = "1"
serde_json.workspace = true
url = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
# `MessageTransport::inbound` returns a `BoxStream`; `connection_state` returns a
# `tokio::sync::watch::Receiver`. Only the sync channels are needed, not a
# runtime, so tokio is pulled with `default-features = false, features = ["sync"]`.
futures-util = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[lints]
workspace = true
