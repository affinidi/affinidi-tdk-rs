[package]
name = "affinidi-messaging-didcomm-v1"
description = "DIDComm v1 (Aries RFC 0019) messaging implementation for the Affinidi TDK"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Implements the protocol-agnostic `MessagingProtocol` trait from
# `affinidi-messaging-core`, so a consumer can drive DIDComm v1 through the
# same surface as DIDComm v2.1 (`affinidi-messaging-didcomm`) and TSP
# (`affinidi-tsp`). Mirrors the identically-named feature on the v2 crate.
messaging-core = ["dep:affinidi-messaging-core", "dep:async-trait"]

[dependencies]
# Ed25519 -> X25519 birational conversion. DIDComm v1 identifies keys by their
# Ed25519 verkey but performs key agreement on the Montgomery form, so every
# pack/unpack goes through these helpers. Only the `ed25519` feature is needed:
# v1 has no curve agility (see `crypto` module docs), so the NIST/K-256 curve
# support the v2 crate pulls in has no v1 counterpart.
affinidi-crypto = { version = "0.2", default-features = false, features = ["ed25519"] }

# X25519 key agreement for crypto_box. Pinned to the 3.x line so this crate
# shares the workspace's single curve25519-dalek 5 generation — the RustCrypto
# `crypto_box` crate would have been a drop-in for `crypto` below, but it
# depends on curve25519-dalek 4 and would reintroduce a second dalek
# generation into the workspace graph.
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }

# NaCl primitives that RFC 0019 is defined in terms of.
# `salsa20` supplies HSalsa20 for the crypto_box key derivation;
# `crypto_secretbox` supplies XSalsa20-Poly1305 for the sealed CEK;
# `blake2` supplies the sealed-box nonce; `chacha20poly1305` supplies the
# content-encryption AEAD (see `crypto::content` for the naming trap).
salsa20 = "0.10"
crypto_secretbox = { version = "0.1", default-features = false, features = ["salsa20"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake2 = "0.10"

# Encoding / serialization. Note `bs58`, not base64: v1 key identifiers are
# base58btc-encoded Ed25519 verkeys.
bs58 = "0.5"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
zeroize = "1"
subtle = "2"
rand_10 = { package = "rand", version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }

# Optional — messaging-core trait integration (see the `messaging-core` feature).
#
# The patch is load-bearing, not decoration: `adapter.rs` names
# `Protocol::DIDCommV1`, which was added in 0.1.6. A loose "0.1" resolves to
# 0.1.6 on a *fresh* build — which is why publish verification passed — but a
# consumer with an existing lockfile, or one pinning `--precise 0.1.5`, gets
# `no variant named DIDCommV1` instead.
affinidi-messaging-core = { path = "../affinidi-messaging-core", version = "0.1.6", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
hex = "0.4"
# The parity test drives a v1 and a v2.1 adapter through one
# `dyn MessagingProtocol`, so it needs the v2 crate's adapter too.
affinidi-messaging-didcomm = { version = "0.15", path = "../affinidi-messaging-didcomm", features = [
  "messaging-core",
] }

[lints]
workspace = true
