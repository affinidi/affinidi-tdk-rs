[package]
name = "affinidi-messaging-delivery"
description = "Reliable messaging delivery layer (durable outbox + drain) over the MessageTransport trait"
version = "0.3.2"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The transport-agnostic contract the delivery layer builds reliability on.
# A minimum patch version, not `0.1`: the drain and dispatcher use API added in
# later 0.1.x releases (`queue_full()`/`retry_after()`, `DeliveryScope`,
# `Inbound::delivery_id`). With the looser requirement `cargo publish
# --dry-run` resolves an older published core, gets past resolution, and then
# fails to *compile* — which the dry-run guard cannot tell from "this crate
# uses an API that does not exist". Naming the version turns it into an unmet
# requirement the guard recognises as waiting on a sibling this release
# publishes.
affinidi-messaging-core = { path = "../affinidi-messaging-core", version = "0.1.13" }
# Matching an evidence sender against an entry's recipient by DID
# (`scid::same_reference`); the identifier helpers need no curve features.
affinidi-did-common = { path = "../../identity/affinidi-did-common", version = "0.4.8", default-features = false }
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util = { workspace = true, features = ["default"] }
# The layer-receipt (§5a) wire body is a tiny typed JSON message.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Binds an inbox record to its payload (`inbox::payload_digest`).
sha2.workspace = true
# `MessagingService` spawns the inbound dispatcher (`rt`) and uses
# broadcast/oneshot/watch (`sync`); the drain uses `time`.
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "sync", "test-util"] }

[features]
# The `MessageTransport` conformance suite (`conformance` module) — panicking
# assertions a wire runs against, so it's opt-in and off in a normal build.
conformance = []

[lints]
workspace = true
