[package]
name = "affinidi-messaging-mediator-tui"
version = "0.1.7"
description = "Terminal console for an Affinidi messaging mediator: statistics, queues with gradient quota bars, messages, purges and a live traffic monitor — as embeddable ratatui components and the `mediator-console` binary."
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "mediator-console"
path = "src/bin/mediator-console.rs"

[dependencies]
affinidi-messaging-mediator-admin = { version = "0.1.5", path = "../affinidi-messaging-mediator-admin" }
ratatui = "0.30"
# Crossterm must match the version ratatui uses.
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
serde = "1"
sha256 = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
affinidi-messaging-test-mediator = { path = "../affinidi-messaging-test-mediator" }
affinidi-messaging-mediator-common = { path = "../affinidi-messaging-mediator/affinidi-messaging-mediator-common" }
affinidi-messaging-didcomm = { path = "../affinidi-messaging-didcomm" }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
