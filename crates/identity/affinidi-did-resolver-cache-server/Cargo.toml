[package]
name = "affinidi-did-resolver-cache-server"
version = "0.11.0"
description = "Affinidi DID Network Cache + Resolver Service"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
# `network` enables the WebSocket resolver endpoint on /ws, which is the
# default transport for `affinidi-did-resolver-cache-sdk` clients. Disable it
# (with `--no-default-features`) to build an HTTP-only cache server that only
# exposes /resolve/{did} and the health endpoints.
default = ["network"]
network = ["affinidi-did-resolver-cache-sdk/network"]

[dependencies]
# Affinidi Crates
# Requires 0.8.19 for WSRequest::agent_name / WSResponse::with_agent_name.
# `did-ethr` / `did-pkh` / `did-jwk` are opt-in in the SDK: most embedding
# libraries do not want them. This is a general-purpose resolver *service*, so
# it keeps full method coverage. `did-jwk` was advertised in the README but not
# actually enabled here between 0.8.22 and now — the SDK gating in #674 moved
# it behind a feature and only `did-ethr` / `did-pkh` were opted back in.
# `did-webs` needs 0.8.47: from 0.8.46 did:webs obeys the host policy, and
# 0.8.47 no longer turns on serde_json's `preserve_order` for the whole build.
affinidi-did-resolver-cache-sdk = { version = "0.8.55", default-features = true, features = ["did-ethr", "did-pkh", "did-jwk", "did-webs"], path = "../affinidi-did-resolver-cache-sdk/" }
affinidi-did-common = "0.4.8"
# Shared background-task supervision (restart-on-failure + health registry)
affinidi-task-utils = "0.1"
affinidi-rate-limit = "0.1"

didwebvh-rs = "0.8.1"
agent-names = "0.1.4"

# External Crates
ahash.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = { workspace = true, features = ["default"] }
clap = { workspace = true, features = ["derive"] }
# Splits a WebSocket into its stream and sink (already in the tree via axum).
futures-util = { workspace = true, features = ["sink", "std"] }
http = "1"
moka = { version = "0.12", features = ["future"] }
regex = "1"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
toml = "1"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
affinidi-secrets-resolver = "0.5.19"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
