[package]
name = "affinidi-did-authentication"
description = "Using proof of DID ownership to authenticate to services"
version = "0.3.21"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
affinidi-crypto = { version = "0.3.2", features = ["jose"] }
affinidi-messaging-didcomm = { path = "../../messaging/affinidi-messaging-didcomm", version = "0.15.15" }
affinidi-did-resolver-cache-sdk = { version = "0.8.55", path = "../affinidi-did-resolver-cache-sdk" }
affinidi-did-common = { version = "0.4.8", path = "../affinidi-did-common", features = ["key-agreement"] }
affinidi-secrets-resolver = { version = "0.5.19", path = "../../core/affinidi-secrets-resolver" }
affinidi-encoding = "0.1.7"
## `HttpStatusError`, shared with the messaging SDK (which depends on this
## crate, so the type cannot live there) and `MessagingError`.
affinidi-messaging-core = { path = "../../messaging/affinidi-messaging-core", version = "0.1.13" }

base64.workspace = true
chrono = { workspace = true, features = ["default"] }
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]
## Captures tracing output to assert sensitive values never log at DEBUG.
tracing-subscriber = { workspace = true, features = ["fmt"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
