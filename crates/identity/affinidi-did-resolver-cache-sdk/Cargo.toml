[package]
name = "affinidi-did-resolver-cache-sdk"
version = "0.8.36"
description = "Affinidi DID Resolver SDK"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local", "did-methods"]
local = []
network = [
  "dep:affinidi-task-utils",
  "dep:web-socket",
  "dep:url",
  "dep:sha1",
  "dep:base64",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "tokio/net",
  "tokio/io-util",
]
did-methods = ["did-webvh", "did-scid"]
did_example = ["dep:did-example"]
did-jwk = ["dep:affinidi-did-jwk"]
# Legacy blockchain DID methods, resolved by in-tree crates. With did:cheqd
# resolution retired in 0.8.36, nothing in this crate reaches the ssi-* stack.
did-ethr = ["dep:affinidi-did-ethr"]
did-pkh = ["dep:affinidi-did-pkh"]
# Retired in 0.8.36 and now inert: `did:cheqd` resolution was removed (see the
# CHANGELOG). The feature is kept, and empty, so that a consumer enabling it
# still builds — `cargo` errors on an unknown feature name, so deleting it would
# be a hard break for a purely additive-to-nothing capability. It will be removed
# at the next major.
did-cheqd = []
did-webvh = ["dep:didwebvh-rs"]
# Agent names: human-memorable "/@" shortcuts resolvable via `resolve_any()`.
agent-names = ["dep:agent-names"]
did-scid = ["dep:did-scid"]
did-ebsi = ["dep:did-ebsi"]
# did:webs — did:web discovery with a KERI-verified key event log.
did-webs = ["dep:affinidi-did-webs"]

[dependencies]
# Affinidi Crates
affinidi-did-common = "0.4"
affinidi-did-resolver-traits = { version = "0.1", path = "../affinidi-did-resolver-traits" }
# Shared background-task supervision (network mode only)
affinidi-task-utils = { version = "0.1", optional = true }
did-example = { version = "0.5", optional = true }
# `default-features = false` selects only the did:webvh backend of did-scid.
did-scid = { version = "0.2.6", optional = true, default-features = false, features = [
  "did-webvh",
] }
did-ebsi = { version = "0.1", path = "../did-methods/did-ebsi", optional = true }
affinidi-did-webs = { version = "0.7", path = "../did-methods/did-webs", optional = true }

# External Crates
ahash = "0.8"
base64 = { version = "0.23", optional = true }
didwebvh-rs = { version = "0.6", optional = true }
# Community-name support (`example.com/@`) needs agent-names >= 0.1.3. The
# requirement stays at `0.1` rather than pinning that floor: both crates
# release from the same commit, so a `0.1.3` floor cannot resolve against the
# registry at publish time. Cargo picks the newest 0.1.x anyway.
agent-names = { version = "0.1", optional = true }
highway = "1"
moka = { version = "0.12", features = ["future"] }
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha1 = { version = "0.11", optional = true }
affinidi-did-web = { version = "0.1", path = "../did-methods/did-web" }
affinidi-did-ethr = { version = "0.1", optional = true, path = "../did-methods/did-ethr" }
affinidi-did-jwk = { version = "0.1", optional = true, path = "../did-methods/did-jwk" }
affinidi-did-pkh = { version = "0.1", optional = true, path = "../did-methods/did-pkh" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", optional = true }
tracing = "0.1"
url = { version = "2", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-socket = { version = "0.7", optional = true }

[dev-dependencies]
affinidi-crypto = "0.2"
affinidi-secrets-resolver = "0.5"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
clap = { version = "4", features = ["derive"] }
num-format = "0.4"
rayon = "1"

# Exercises `resolve_any` and `with_resolve_shortcuts`, so it only builds with
# the feature that provides them. Without this, `cargo test` on a build that
# does not enable `agent-names` fails compiling the example rather than running
# the suite.
[[example]]
name = "agent_name_diagnose"
required-features = ["agent-names"]

[lints]
workspace = true
