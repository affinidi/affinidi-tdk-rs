[package]
name = "affinidi-did-resolver-cache-sdk"
version = "0.8.57"
description = "Affinidi DID Resolver SDK"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local", "did-methods"]
local = []
network = [
  "dep:affinidi-task-utils",
  "dep:web-socket",
  "dep:url",
  "dep:sha1",
  "dep:base64",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "tokio/net",
  "tokio/io-util",
]
did-methods = ["did-webvh", "did-scid"]
did_example = ["dep:did-example"]
did-jwk = ["dep:affinidi-did-jwk", "affinidi-did-jwk/resolver-traits"]
# Legacy blockchain DID methods, resolved by in-tree crates. With did:cheqd
# resolution retired in 0.8.36, nothing in this crate reaches the ssi-* stack.
did-ethr = ["dep:affinidi-did-ethr", "affinidi-did-ethr/resolver-traits"]
did-pkh = ["dep:affinidi-did-pkh", "affinidi-did-pkh/resolver-traits"]
# Retired in 0.8.36 and now inert: `did:cheqd` resolution was removed (see the
# CHANGELOG). The feature is kept, and empty, so that a consumer enabling it
# still builds — `cargo` errors on an unknown feature name, so deleting it would
# be a hard break for a purely additive-to-nothing capability. It will be removed
# at the next major.
did-cheqd = []
did-webvh = ["dep:didwebvh-rs"]
# Agent names: human-memorable "/@" shortcuts resolvable via `resolve_any()`.
agent-names = ["dep:agent-names"]
# `didwebvh-rs` is already in the graph through `did-scid`; naming it lets the
# resolver build the `ResolveOptions` that `did-scid` takes.
did-scid = ["dep:did-scid", "dep:didwebvh-rs"]
did-ebsi = ["dep:did-ebsi", "did-ebsi/resolver-traits"]
# did:webs — did:web discovery with a KERI-verified key event log.
did-webs = ["dep:affinidi-did-webs", "affinidi-did-webs/resolver-traits"]

[dependencies]
# Affinidi Crates
# 0.4.8: `NetworkError`, the failed fetch the method crates report.
affinidi-did-common = { version = "0.4.8", path = "../affinidi-did-common" }
# 0.1.4 introduced `ResolverError::NetworkFetch`, which this crate matches on;
# 0.1.5 converts a `NetworkError` into it, with its `Retry-After`.
affinidi-did-resolver-traits = { version = "0.1.5", path = "../affinidi-did-resolver-traits" }
# Shared background-task supervision (network mode only)
affinidi-task-utils = { version = "0.1", optional = true }
did-example = { version = "0.5", optional = true }
# `default-features = false` leaves out did-scid's `did-webs` backend
# (`did:scid:ke`); 0.4.9: `DIDSCIDError::network_error`.
did-scid = { version = "0.4.9", path = "../did-methods/did-scid", optional = true, default-features = false, features = [
  "did-webvh",
] }
# 0.1.10: `EbsiResolver` is an `AsyncResolver` (`resolver-traits`).
did-ebsi = { version = "0.1.10", path = "../did-methods/did-ebsi", optional = true }
# 0.13.8: `WebsResolver` is an `AsyncResolver` (`resolver-traits`).
affinidi-did-webs = { version = "0.13.8", path = "../did-methods/did-webs", optional = true }

# External Crates
ahash.workspace = true
base64 = { workspace = true, optional = true }
didwebvh-rs = { version = "0.8.1", optional = true }
# Community-name support (`example.com/@`) needs agent-names >= 0.1.3. The
# requirement stays at `0.1` rather than pinning that floor: both crates
# release from the same commit, so a `0.1.3` floor cannot resolve against the
# registry at publish time. Cargo picks the newest 0.1.x anyway.
agent-names = { version = "0.1.4", optional = true }
highway = "1"
moka = { version = "0.12", features = ["future"] }
rand.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
sha1 = { version = "0.11", optional = true }
# 0.1.11: `DIDWeb` is an `AsyncResolver` (`resolver-traits`).
affinidi-did-web = { version = "0.1.11", path = "../did-methods/did-web", features = ["resolver-traits"] }
affinidi-did-ethr = { version = "0.1.5", optional = true, path = "../did-methods/did-ethr" }
affinidi-did-jwk = { version = "0.1.3", optional = true, path = "../did-methods/did-jwk" }
affinidi-did-pkh = { version = "0.1.5", optional = true, path = "../did-methods/did-pkh" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", optional = true }
tracing.workspace = true
url = { workspace = true, optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-socket = { version = "0.7", optional = true }

[dev-dependencies]
affinidi-crypto = "0.3.2"
affinidi-secrets-resolver = { version = "0.5.19", path = "../../core/affinidi-secrets-resolver" }
chrono = { workspace = true, features = ["default"] }
futures-util = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
clap = { workspace = true, features = ["derive"] }
num-format = "0.4"
rayon = "1"

# Exercises `resolve_any` and `with_resolve_shortcuts`, so it only builds with
# the feature that provides them. Without this, `cargo test` on a build that
# does not enable `agent-names` fails compiling the example rather than running
# the suite.
[[example]]
name = "agent_name_diagnose"
required-features = ["agent-names"]

[lints]
workspace = true
