[package]
name = "affinidi-did-jwk"
version = "0.1.3"
description = "Minimal did:jwk DID method resolver for the Affinidi TDK"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# `JwkResolver`: did:jwk as an `affinidi-did-resolver-traits` `Resolver`, so a
# resolver chain can hold it without an adapter.
resolver-traits = ["dep:affinidi-did-resolver-traits"]

[dependencies]
# `JwkResolver`, an `affinidi-did-resolver-traits` `Resolver` for did:jwk.
# 0.1.6: `NetworkFetchError` converts from `NetworkError`.
affinidi-did-resolver-traits = { version = "0.1.6", path = "../../affinidi-did-resolver-traits", optional = true }
affinidi-did-common = "0.4.8"
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
