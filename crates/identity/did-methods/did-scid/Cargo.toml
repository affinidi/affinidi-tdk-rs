
[package]
name = "did-scid"
version = "0.4.11"
description = "Implementation of did:scid in Rust"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
# Retired in 0.2.6 and now inert: `did:cheqd` resolution was removed (see the
# CHANGELOG). Kept, and empty, so a consumer enabling it still builds.
did-cheqd = []
default = ["did-webvh"]

# Inert since 0.4.9: `didwebvh-rs` is a hard dependency, because the public API
# (`ResolveOptions`, `DIDSCIDError::WebVHError`) is typed in it and the crate
# never built without it. Kept, and empty, so a consumer enabling it still
# builds.
did-webvh = []
# did:scid:ke — a KERI AID via did:webs. Optional so did-scid does not pull the
# KERI stack into builds that never resolve it. `reqwest` builds the did:webs
# resolver's client with the caller's timeout.
did-webs = ["dep:affinidi-did-webs", "dep:reqwest"]
# `ScidResolver`: did:scid as an `affinidi-did-resolver-traits`
# `AsyncResolver`, so a resolver chain can hold it without an adapter.
resolver-traits = ["dep:affinidi-did-resolver-traits"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.4.8: `NetworkError`.
affinidi-did-common = "0.4.8"

# 0.1.6: `NetworkFetchError` converts from `NetworkError`.
affinidi-did-resolver-traits = { version = "0.1.6", path = "../../affinidi-did-resolver-traits", optional = true }
# 0.13.6: `DidWebsError::Network`.
affinidi-did-webs = { version = "0.13.6", optional = true }
didwebvh-rs = "0.8.1"
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Creating and deactivating a did:webs identifier for the `ke` tests.
affinidi-did-webs = { version = "0.13.6", features = ["create"] }
affinidi-keri = { version = "0.8.1", default-features = false }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
