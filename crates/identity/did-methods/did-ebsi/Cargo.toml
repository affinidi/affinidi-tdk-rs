[package]
name = "did-ebsi"
version = "0.1.9"
description = "Implementation of did:ebsi (EBSI DID method for legal entities) in Rust"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.4.8: `NetworkError` and `Document::from_json_slice`.
affinidi-did-common = "0.4.8"
bs58 = "0.5"
rand.workspace = true
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
