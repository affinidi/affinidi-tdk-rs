[package]
name = "affinidi-did-pkh"
version = "0.1.5"
description = "Minimal did:pkh DID method resolver for the Affinidi TDK"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# `PkhResolver`: did:pkh as an `affinidi-did-resolver-traits` `Resolver`, so a
# resolver chain can hold it without an adapter.
resolver-traits = ["dep:affinidi-did-resolver-traits"]

[dependencies]
# `PkhResolver`, an `affinidi-did-resolver-traits` `Resolver` for did:pkh.
# 0.1.6: `NetworkFetchError` converts from `NetworkError`.
affinidi-did-resolver-traits = { version = "0.1.6", path = "../../affinidi-did-resolver-traits", optional = true }
affinidi-did-common = "0.4.8"
base64.workspace = true
bech32 = "0.12"
bs58 = "0.5"
serde_json.workspace = true
sha2.workspace = true
sha3 = "0.12"
thiserror.workspace = true

[lints]
workspace = true
