[package]
name = "affinidi-did-webs"
version = "0.12.0"
description = "Implementation of the did:webs DID method: did:web discovery with KERI-verified key state"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Creating identifiers, as opposed to resolving them. Optional because it pulls
# `affinidi-keri`, and with it an LMDB-backed store this crate never uses for
# resolution — see `create` for why the store is not required at runtime.
create = ["dep:affinidi-keri", "dep:serde", "dep:getrandom", "chrono/clock"]

[dependencies]
affinidi-cesr = "0.1.4"
base64 = "0.23"
affinidi-keri = { version = "0.7", optional = true }
# Resolution parses the `dt` of KERI replies, which BADA orders by; creation
# also stamps them, which needs the clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
affinidi-crypto = "0.2"
affinidi-keri-core = "0.7"
affinidi-keri-crypto = "0.7"
affinidi-did-common = "0.4"
# Converts a key-state Ed25519 key to its X25519 key (`key_agreement`).
ed25519-dalek = "3"
# A KERI 2.x registry's nonce and each update's blinding UUID (`create`).
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
# The SSRF guard: a did:webs DID names the host its artifacts are fetched from.
affinidi-net-guard = "0.1.1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "charset",
  "http2",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true

[[example]]
name = "emit_keripy_fixture"
required-features = ["create"]
