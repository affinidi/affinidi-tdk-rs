[package]
name = "affinidi-did-webs"
version = "0.7.0"
description = "Implementation of the did:webs DID method: did:web discovery with KERI-verified key state"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Creating identifiers, as opposed to resolving them. Optional because it pulls
# `affinidi-keri`, and with it an LMDB-backed store this crate never uses for
# resolution — see `create` for why the store is not required at runtime.
create = ["dep:affinidi-keri", "dep:serde", "dep:chrono"]

[dependencies]
affinidi-cesr = "0.1.3"
affinidi-keri = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }
affinidi-crypto = "0.2"
affinidi-keri-core = "0.4"
affinidi-keri-crypto = "0.4"
affinidi-did-common = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "charset",
  "http2",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
