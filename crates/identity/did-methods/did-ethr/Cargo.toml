[package]
name = "affinidi-did-ethr"
version = "0.2.0"
description = "Minimal did:ethr DID method resolver for the Affinidi TDK"
repository.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# `EthrResolver`: did:ethr as an `affinidi-did-resolver-traits` `Resolver`, so a
# resolver chain can hold it without an adapter.
resolver-traits = ["dep:affinidi-did-resolver-traits"]

[dependencies]
# `EthrResolver`, an `affinidi-did-resolver-traits` `Resolver` for did:ethr.
# 0.1.6: `NetworkFetchError` converts from `NetworkError`.
affinidi-did-resolver-traits = { version = "0.2.0", path = "../../affinidi-did-resolver-traits", optional = true }
affinidi-did-common = "0.5.0"
base64.workspace = true
hex.workspace = true
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
serde_json.workspace = true
sha3 = "0.12"
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
