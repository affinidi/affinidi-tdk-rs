[package]
name = "affinidi-siopv2"
description = "Self-Issued OpenID Provider v2 (SIOPv2) for decentralized authentication."
version = "0.2.1"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "siopv2", "openid", "self-issued"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[example]]
name = "siop_authentication"
path = "examples/siop_authentication.rs"

[[example]]
name = "did_authentication"
path = "examples/did_authentication.rs"

[dependencies]
affinidi-oid4vc-core = { version = "0.1.12", path = "../affinidi-oid4vc-core", features = ["es256", "eddsa"] }

base64.workspace = true
chrono = { workspace = true, features = ["default", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
