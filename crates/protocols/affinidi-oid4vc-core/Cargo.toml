[package]
name = "affinidi-oid4vc-core"
description = "Shared types for the OpenID for Verifiable Credentials (OID4VC) protocol family."
version = "0.1.10"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "openid4vc", "siopv2"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["es256", "eddsa"]
_test-utils = []
es256 = ["dep:p256", "dep:rand_10"]
eddsa = ["dep:ed25519-dalek", "dep:rand_10"]
# Compact JWE with ECDH-ES direct (A128GCM / A256GCM): the OpenID4VP 1.0
# encrypted authorization response (`direct_post.jwt`).
jwe = ["dep:affinidi-crypto", "dep:zeroize"]

[dependencies]
# >= 0.2.11 for `jose::gcm` (A128GCM / A256GCM).
affinidi-crypto = { version = "0.2.11", features = ["jose"], optional = true }
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }
p256 = { version = "0.14", features = ["ecdsa", "arithmetic"], optional = true }
rand_10 = { package = "rand", version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"
zeroize = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
