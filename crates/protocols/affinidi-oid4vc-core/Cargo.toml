[package]
name = "affinidi-oid4vc-core"
description = "Shared types for the OpenID for Verifiable Credentials (OID4VC) protocol family."
version = "0.1.12"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "openid4vc", "siopv2"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["es256", "eddsa"]
_test-utils = []
es256 = ["dep:p256", "dep:rand_10"]
eddsa = ["dep:ed25519-dalek", "dep:rand_10"]
# Compact JWE with ECDH-ES direct (A128GCM / A256GCM): the OpenID4VP 1.0
# encrypted authorization response (`direct_post.jwt`).
jwe = ["dep:affinidi-crypto", "dep:zeroize"]
# Adapters from the raw-bytes `jwt::JwtSigner` / `jwt::JwtVerifier` to
# affinidi-sd-jwt's compact-JWS traits (`sd_jwt` module), plus a production
# KB-JWT holder-key verifier when `es256` / `eddsa` are on.
sd-jwt = ["dep:affinidi-sd-jwt"]

[dependencies]
# >= 0.2.11 for `jose::gcm` (A128GCM / A256GCM).
affinidi-crypto = { version = "0.3.2", features = ["jose"], optional = true }
affinidi-sd-jwt = { version = "0.2", path = "../../credentials/affinidi-sd-jwt", optional = true }
base64.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"], optional = true }
p256 = { version = "0.14", features = ["ecdsa", "arithmetic"], optional = true }
rand_10 = { package = "rand", version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
