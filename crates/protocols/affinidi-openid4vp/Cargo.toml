[package]
name = "affinidi-openid4vp"
description = "OpenID for Verifiable Presentations (OpenID4VP) implementation."
version = "0.1.5"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "openid4vp", "presentations"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Receive an encrypted `direct_post.jwt` authorization response (JWE with
# ECDH-ES direct, A128GCM / A256GCM).
direct-post-jwt = ["affinidi-oid4vc-core/jwe"]

[dependencies]
# >= 0.1.10 for the `jwe` module behind `direct-post-jwt`.
affinidi-oid4vc-core = { version = "0.1.12", path = "../affinidi-oid4vc-core" }
base64.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
