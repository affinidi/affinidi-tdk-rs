[package]
name = "affinidi-trust-lists"
description = "EU Trusted Lists (ETSI TS 119 612) for eIDAS 2.0 trust infrastructure."
version = "0.2.1"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords = ["ssi", "affinidi", "eidas", "trust-list", "etsi"]
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[example]]
name = "lookup_issuer"
path = "examples/lookup_issuer.rs"

[[example]]
name = "browse_trust_list"
path = "examples/browse_trust_list.rs"

[dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["default", "serde"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
x509-parser = { version = "0.18", features = ["verify-aws"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
