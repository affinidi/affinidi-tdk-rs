[package]
name = "affinidi-tdk-common"
description = "Common utilities for Affinidi Trust Development Kit."
version = "0.7.3"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
affinidi-did-resolver-cache-sdk = "0.8.55"
# Pinned to the exact sibling version this crate now needs:
# `DIDAuthError::Timeout` / `TaskUnavailable` and `Clone` land in 0.3.17, so an
# older floor would resolve a published version that fails to compile. Naming the local version is also what lets the publish
# dry-run guard report `wait` (sibling not on crates.io yet) rather than a
# registry-drift failure — see scripts/check-publish-dry-run.sh.
affinidi-did-authentication = "0.3.17"
affinidi-did-common = "0.4.8"
# A public dependency: re-exported as `net_guard`, and
# `create_guarded_http_client` takes and returns its types. Exact sibling
# version for the same publish dry-run reason as above.
affinidi-net-guard = "0.1.1"
affinidi-secrets-resolver = "0.5.19"
affinidi-data-integrity = "0.8.9"

ahash.workspace = true
base64.workspace = true
keyring-core = "1"
moka = { version = "0.12", features = ["future"] }
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
# PEM parsing comes from rustls-pki-types (already re-exported by rustls as
# `rustls::pki_types`) rather than rustls-pemfile: that crate is archived and
# unmaintained (RUSTSEC-2025-0134), and its final release is a thin wrapper
# over exactly this code. No replacement dependency is needed.
rustls-platform-verifier = "0.7"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[package.metadata.docs.rs]
# Render rustdoc on all supported platforms so the cfg-gated platform-store
# modules in `secrets` (apple/windows/dbus) all show up.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
