[workspace]
members = [
  # Core: encoding, cryptography, key management, CESR
  "crates/core/affinidi-cesr",
  "crates/core/affinidi-encoding",
  "crates/core/affinidi-crypto",
  "crates/core/affinidi-rate-limit",
  "crates/core/affinidi-secrets-resolver",
  "crates/core/affinidi-bbs",
  "crates/core/affinidi-task-utils",
  "crates/core/affinidi-net-guard",

  # Identity: DID resolution, authentication
  "crates/identity/affinidi-did-common",
  "crates/identity/affinidi-did-resolver-cache-sdk",
  "crates/identity/affinidi-did-resolver-cache-server",
  "crates/identity/did-methods/did-example",
  "crates/identity/did-methods/did-scid",
  "crates/identity/did-methods/did-ebsi",
  "crates/identity/did-methods/did-web",
  "crates/identity/did-methods/did-webs",
  "crates/identity/did-methods/did-ethr",
  "crates/identity/did-methods/did-jwk",
  "crates/identity/did-methods/did-pkh",
  "crates/identity/affinidi-did-resolver-traits",
  "crates/identity/affinidi-did-authentication",
  "crates/identity/shortcuts/agent-names",

  # Credentials: formats, proofs, status
  "crates/credentials/affinidi-sd-jwt",
  "crates/credentials/affinidi-data-integrity",
  "crates/credentials/affinidi-rdf-encoding",
  "crates/credentials/affinidi-vc",
  "crates/credentials/affinidi-status-list",
  "crates/credentials/affinidi-sd-jwt-vc",
  "crates/credentials/affinidi-mdoc",

  # Protocols: OID4VC core, SIOPv2, OpenID4VCI, OpenID4VP
  "crates/protocols/affinidi-oid4vc-core",
  "crates/protocols/affinidi-siopv2",
  "crates/protocols/affinidi-openid4vci",
  "crates/protocols/affinidi-openid4vp",

  # Messaging: core, DIDComm, TSP, SDK, mediator
  "crates/messaging/affinidi-messaging-core",
  "crates/messaging/affinidi-messaging-delivery",
  "crates/messaging/affinidi-messaging-didcomm",
  "crates/messaging/affinidi-messaging-didcomm-v1",
  "crates/messaging/affinidi-tsp",
  "crates/messaging/affinidi-messaging-sdk",
  "crates/messaging/affinidi-messaging-helpers",
  "crates/messaging/affinidi-messaging-didcomm-service",
  "crates/messaging/affinidi-messaging-mediator/affinidi-messaging-mediator-common",
  "crates/messaging/affinidi-messaging-mediator/affinidi-messaging-mediator-config",
  "crates/messaging/affinidi-messaging-mediator/affinidi-messaging-mediator-processors",
  "crates/messaging/affinidi-messaging-mediator",
  "crates/messaging/affinidi-messaging-mediator/tools/mediator-setup",
  "crates/messaging/affinidi-messaging-mediator/tools/mediator-monitor",
  "crates/messaging/affinidi-messaging-test-mediator",
  "crates/messaging/affinidi-messaging-text-client",

  # Trust: trust infrastructure
  "crates/trust/affinidi-trust-lists",

  # TDK: unified entry point
  "crates/tdk/affinidi-tdk-common",
  "crates/tdk/affinidi-tdk",
  "crates/tdk/affinidi-tdk-test-support",

  # Applications
  "crates/applications/affinidi-meeting-place",
]
resolver = "3"

[workspace.package]
description = "Affinidi Trust Development Kit. A Rust library for building secure, privacy-preserving, and interoperable applications."
edition = "2024"
authors = ["Glenn Gore <glenn@affinidi.com>"]
readme = "README.md"
homepage = "https://affinidi.com/"
license = "Apache-2.0"
keywords = ["ssi", "affinidi"]
repository = "https://github.com/affinidi/affinidi-tdk-rs"
publish = true
rust-version = "1.95.0"

[workspace.dependencies]
tokio = "1"

# Upper bound on `aws-smithy-types`, which nothing in this workspace calls.
#
# **This is here to constrain the resolver, not because anything uses it.**
# `aws-smithy-types` 1.7.0 changed `Document::Object` from
# `HashMap<String, Document>` to a new `DocumentObject`, and added a variant to
# an enum that is `#[non_exhaustive]` — a breaking change shipped as a MINOR
# bump. `aws-smithy-json` 0.63.0 declares `aws-smithy-types = "^1.6.1"`, which
# admits 1.7.0 and then fails to compile against it, inside the registry source:
#
#   error[E0308]: expected `DocumentObject`, found `HashMap<String, Document>`
#   error[E0004]: non-exhaustive patterns: `&_` not covered
#
# Cargo unifies `aws-smithy-types` to one version across the graph but keeps
# both `aws-smithy-json` 0.63 and 0.64 (0.x minors are incompatible majors), so
# the two coexist and only the 0.63 copy breaks. We have both because the newer
# `aws-sdk-*` releases moved to json `^0.64.0` while `aws-config` 1.12.0 — its
# newest release — still wants `^0.63.0`, and `aws-config` is what every AWS
# feature here pulls.
#
# **This workspace ships no `Cargo.lock`** (it is in `.gitignore`), so there is
# no lockfile to hold the working set and `--locked` has nothing to honour:
# every clone resolves from scratch and every fresh resolve takes the break.
# The manifest is the only place the constraint can live. A
# `[workspace.dependencies]` entry alone constrains nothing, though — Cargo
# honours a requirement only from a crate that *declares* the dependency, so
# each crate whose subtree pulls `aws-config` names it below, under the same
# feature.
#
# **Remove this the moment `aws-config` ships a release on json 0.64.** The
# bound is `< 1.7` rather than `= 1.6.3` so patch releases in the working line
# are still picked up; it is an exclusion of the break, not a freeze.
aws-smithy-types = ">=1.6.1, <1.7"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true

# Redirect crates.io deps to local workspace crates so all members use the same version.
# Only needed for crates that are referenced by version (not path) in other workspace members.
[patch.crates-io]
affinidi-secrets-resolver = { path = "crates/core/affinidi-secrets-resolver" }
affinidi-task-utils = { path = "crates/core/affinidi-task-utils" }
affinidi-rate-limit = { path = "crates/core/affinidi-rate-limit" }
affinidi-net-guard = { path = "crates/core/affinidi-net-guard" }
affinidi-did-resolver-cache-sdk = { path = "crates/identity/affinidi-did-resolver-cache-sdk" }
affinidi-did-common = { path = "crates/identity/affinidi-did-common" }
affinidi-crypto = { path = "crates/core/affinidi-crypto" }
affinidi-encoding = { path = "crates/core/affinidi-encoding" }
affinidi-data-integrity = { path = "crates/credentials/affinidi-data-integrity" }
affinidi-messaging-didcomm = { path = "crates/messaging/affinidi-messaging-didcomm" }
affinidi-messaging-didcomm-v1 = { path = "crates/messaging/affinidi-messaging-didcomm-v1" }
affinidi-messaging-sdk = { path = "crates/messaging/affinidi-messaging-sdk" }
affinidi-messaging-mediator = { path = "crates/messaging/affinidi-messaging-mediator" }
affinidi-messaging-mediator-common = { path = "crates/messaging/affinidi-messaging-mediator/affinidi-messaging-mediator-common" }
affinidi-messaging-test-mediator = { path = "crates/messaging/affinidi-messaging-test-mediator" }
affinidi-did-authentication = { path = "crates/identity/affinidi-did-authentication" }
affinidi-tdk-common = { path = "crates/tdk/affinidi-tdk-common" }
affinidi-tdk = { path = "crates/tdk/affinidi-tdk" }
affinidi-meeting-place = { path = "crates/applications/affinidi-meeting-place" }
affinidi-tsp = { path = "crates/messaging/affinidi-tsp" }
affinidi-did-web = { path = "crates/identity/did-methods/did-web" }
# `affinidi-did-webs` depends on `affinidi-cesr` by version, and so does
# `affinidi-keri-core` from the registry. Without this redirect the workspace
# builds both the local copy and a crates.io copy, and a `Matter` crossing
# between them is a mismatched type that points anywhere but here.
affinidi-cesr = { path = "crates/core/affinidi-cesr" }
affinidi-did-webs = { path = "crates/identity/did-methods/did-webs" }
affinidi-did-ethr = { path = "crates/identity/did-methods/did-ethr" }
affinidi-did-jwk = { path = "crates/identity/did-methods/did-jwk" }
affinidi-did-pkh = { path = "crates/identity/did-methods/did-pkh" }
did-scid = { path = "crates/identity/did-methods/did-scid" }
did-example = { path = "crates/identity/did-methods/did-example" }
affinidi-messaging-core = { path = "crates/messaging/affinidi-messaging-core" }
agent-names = { path = "crates/identity/shortcuts/agent-names" }
affinidi-vc = { path = "crates/credentials/affinidi-vc" }
affinidi-sd-jwt = { path = "crates/credentials/affinidi-sd-jwt" }
affinidi-oid4vc-core = { path = "crates/protocols/affinidi-oid4vc-core" }
affinidi-openid4vci = { path = "crates/protocols/affinidi-openid4vci" }
affinidi-openid4vp = { path = "crates/protocols/affinidi-openid4vp" }
affinidi-messaging-delivery = { path = "crates/messaging/affinidi-messaging-delivery" }

[workspace.lints.clippy]
uninlined_format_args = "warn"
